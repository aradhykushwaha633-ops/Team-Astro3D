<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Earth &amp; Neighbours · COSMOSIS</title>
<style>
:root{--c:#5fd8ff;--t:#e3edf8;--m:#9fb3c8;--b:rgba(120,200,255,.22);--g:rgba(8,16,28,.64)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:var(--t);font:13px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.glass{background:var(--g);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--b);border-radius:14px}
.back{position:fixed;z-index:20;top:calc(env(safe-area-inset-top,0px) + 12px);left:14px;height:36px;padding:0 15px;display:inline-flex;align-items:center;border-radius:999px;color:var(--t);text-decoration:none;font-weight:600;background:rgba(8,16,28,.65);border:1px solid var(--b)}
.back:hover{background:rgba(95,216,255,.2)}
#title{position:fixed;z-index:5;left:16px;top:calc(60px + env(safe-area-inset-top,0px));padding:8px 12px;max-width:260px}
#title b{letter-spacing:.2em;color:var(--c);font-size:13px}
#title span{display:block;color:var(--m);font-size:11px}
#ui{position:fixed;z-index:6;right:14px;top:14px;bottom:14px;width:min(370px,calc(100vw - 28px));overflow:auto;padding:14px}
h2{margin:0 0 2px;font-size:17px;letter-spacing:.12em;color:var(--c)}
h3{margin:15px 0 6px;font-size:11px;letter-spacing:.14em;color:var(--m);text-transform:uppercase}
p{margin:6px 0}
button{font:inherit;color:var(--t);background:rgba(255,255,255,.07);border:1px solid var(--b);border-radius:9px;padding:6px 10px;cursor:pointer;min-height:32px}
button:hover{background:rgba(95,216,255,.18)}
button.on{background:rgba(95,216,255,.28);border-color:var(--c)}
button:focus-visible{outline:2px solid var(--c)}
.row{display:flex;flex-wrap:wrap;gap:6px}
table{width:100%;border-collapse:collapse;font-size:12px}
td{padding:5px 6px;border-top:1px solid rgba(255,255,255,.09);vertical-align:top}
td:first-child{color:var(--m);width:30%}
.chk span{padding:3px 9px;border-radius:999px;font-size:11.5px;border:1px solid}
.chk .ok{color:#7dffb0;border-color:rgba(125,255,176,.45);background:rgba(125,255,176,.1)}
.chk .no{color:#ff9a9a;border-color:rgba(255,154,154,.4);background:rgba(255,154,154,.08)}
.q button{display:block;width:100%;text-align:left;margin-top:6px}
.q .good{border-color:#7dffb0;background:rgba(125,255,176,.18)}
.q .bad{border-color:#ff9a9a;background:rgba(255,154,154,.18)}
@media(max-width:760px){#ui{top:auto;left:8px;right:8px;bottom:8px;width:auto;max-height:47vh}#title{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<script src="script2.js"></script>
<script src="script1.js"></script>
</head>
<body>
<canvas id="c" aria-label="3D planet viewer"></canvas>
<a class="back" href="index.html">← Back</a>
<div id="title" class="glass"><b>EARTH &amp; NEIGHBOURS</b><span>Mercury to Pluto · drag to rotate · scroll or pinch to zoom</span></div>
<div id="ui" class="glass"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="script6.js"></script>
<script>
(function () {
  var E = window.CosmosEarth, $ = function (s) { return document.querySelector(s); }, ui = $('#ui');
  if (!E || !window.THREE || !THREE.OrbitControls) { ui.innerHTML = '<h2>Could not load 3D</h2><p>Three.js loads from a CDN. Check your internet connection and reload.</p>'; return; }
  var P = E.P, env = E.init($('#c'), { shift: 185, shiftY: .2 }), pl = {};
  var ORD = ['earth', 'moon', 'mercury', 'venus', 'mars', 'jupiter', 'saturn', 'uranus', 'neptune', 'pluto'], ICON = { earth: '🌍', moon: '🌙', mercury: '⚪', venus: '🟡', mars: '🔴', jupiter: '🟠', saturn: '🪐', uranus: '🔵', neptune: '🔷', pluto: '🤍' };
  var SZ = { moon: .27, mercury: .38, mars: .53, venus: .95, jupiter: 2.4, saturn: 1.9, uranus: 1.4, neptune: 1.35, pluto: .19 };
  var LB = ['Radius', 'Gravity', 'Temperature', 'Day length', 'Atmosphere', 'Liquid water', 'Magnetic field', 'Distance from Sun'];
  var CK = ['💧 Liquid water', '🫁 Breathable air', '🌡️ Safe temperature', '🧲 Magnetic shield', '🪨 Solid ground'];
  var QZ = [
    ['Which layer of Earth creates its magnetic field?', ['Crust', 'Mantle', 'Outer core', 'Inner core'], 2, 'The liquid iron of the outer core flows and acts like a dynamo, creating the magnetic field.'],
    ['What makes Venus the hottest planet, even though Mercury is closer to the Sun?', ['It spins backwards', 'Its thick CO₂ atmosphere traps heat', 'It has many volcanoes', 'It has no clouds'], 1, 'A thick CO₂ blanket causes a runaway greenhouse effect.'],
    ['Why can’t liquid water stay on the surface of Mars?', ['Its air is too thin and it is too cold', 'It is too close to the Sun', 'It has too much oxygen', 'It has no ground'], 0, 'With only 0.6% of Earth’s air pressure, water freezes or boils away.'],
    ['Which planet has the biggest iron core compared with its size?', ['Mercury', 'Earth', 'Mars', 'Neptune'], 0, 'Mercury’s core is about 83% of its radius, a huge iron ball under a thin rocky shell.'],
    ['What are Saturn’s rings made of?', ['Solid rock hoops', 'Billions of icy chunks orbiting in a thin disc', 'Frozen clouds', 'Dust from Mars'], 1, 'Mostly water-ice pieces from dust grains to house-sized blocks, in a disc often only tens of metres thick.'],
    ['Why are Uranus and Neptune called “ice giants”?', ['They are covered in glaciers', 'Their interiors hold hot, dense water, ammonia and methane “ices”', 'They are made only of frozen hydrogen', 'They are colder than Pluto'], 1, 'Astronomers call water, ammonia and methane “ices”, even though deep inside the giants they are hot and fluid.']
  ];
  ORD.forEach(function (k) { pl[k] = E.planet(k); pl[k].g.visible = false; env.add(pl[k]); });
  var sel = 'earth', mode = 'x', cutOn = false, hi = -1, q = null;

  function other() { return sel === 'earth' ? 'mars' : sel; }
  function layout() {
    var two = mode === 'c', o = other();
    ORD.forEach(function (k) { pl[k].g.visible = false; });
    if (!two) { var p = pl[sel]; p.g.visible = true; p.g.position.set(0, 0, 0); p.g.scale.setScalar(1.25); env.dist(4 * Math.max(1, P[sel].ext * .62)); }
    else {
      var s = SZ[o], ex = s * P[o].ext, tot = 2.5 + 2 * ex, a = pl.earth, b = pl[o]; a.g.visible = b.g.visible = true;
      a.g.scale.setScalar(1); a.g.position.set(-tot / 2 + 1, 0, 0); b.g.scale.setScalar(s); b.g.position.set(tot / 2 - ex, 0, 0); env.dist(Math.max(4.2, 2.4 + tot * .62));
    }
    ORD.forEach(function (k) { pl[k].cut(cutOn); pl[k].hi(hi); });
  }
  function quiz() {
    if (!q) return '<button data-a="qs">Start the 6-question quiz (+20 XP)</button>';
    if (q.i >= QZ.length) return '<p><b>Score: ' + q.s + '/' + QZ.length + '</b> ' + (q.s >= 4 ? (q.xp ? '· +20 XP earned! 🎉' : '· great job!') : '· read the facts above and try again.') + '</p><button data-a="qs">Try again</button>';
    var z = QZ[q.i];
    return '<div class="q"><p><b>Q' + (q.i + 1) + '.</b> ' + z[0] + '</p>' + z[1].map(function (o, i) {
      var c = q.a < 0 ? '' : i === z[2] ? ' good' : i === q.a ? ' bad' : '';
      return '<button data-a="qa" data-i="' + i + '" class="' + c + '"' + (q.a >= 0 ? ' disabled' : '') + '>' + o + '</button>';
    }).join('') + (q.a >= 0 ? '<p>' + (q.a === z[2] ? '✅ ' : '❌ ') + z[3] + '</p><button data-a="qn">Next →</button>' : '') + '</div>';
  }
  function render() {
    var st = ui.scrollTop, two = mode === 'c', k = two ? other() : sel, d = P[k], e = P.earth, h = '';
    h += '<h2>' + (two ? 'EARTH vs ' + d.n.toUpperCase() : d.n.toUpperCase()) + '</h2><div style="color:var(--m)">' + d.tag + '</div>';
    h += '<h3>Choose a world</h3><div class="row">' + ORD.map(function (x) { return '<button data-a="p" data-v="' + x + '" class="' + (x === sel ? 'on' : '') + '">' + ICON[x] + ' ' + P[x].n + '</button>'; }).join('') + '</div>';
    h += '<div class="row" style="margin-top:8px"><button data-a="m" data-v="x" class="' + (!two ? 'on' : '') + '">Explore</button><button data-a="m" data-v="c" class="' + (two ? 'on' : '') + '">Compare with Earth</button><button data-a="cut" class="' + (cutOn ? 'on' : '') + '">✂ ' + (cutOn ? 'Close it' : 'Cut open the core') + '</button></div>';
    if (cutOn) {
      var Ls = d.layers;
      h += '<h3>Inside ' + d.n + '</h3><div class="row">' + Ls.map(function (l, i) { return '<button data-a="L" data-i="' + i + '" class="' + (hi === i ? 'on' : '') + '" style="border-left:6px solid ' + l[1] + '">' + l[2] + '</button>'; }).join('') + '</div>';
      h += '<p>' + (hi < 0 ? 'Tap a layer to light it up. Drag the planet to look around the cut.' : '<b>' + Ls[hi][2] + ':</b> ' + Ls[hi][3]) + '</p>';
    }
    h += '<h3>' + (two ? 'Compare' : 'Facts') + '</h3><table>' + (two ? '<tr><td></td><td><b>Earth</b></td><td><b>' + d.n + '</b></td></tr>' : '') +
      LB.map(function (l, i) { return '<tr><td>' + l + '</td>' + (two ? '<td>' + e.f[i] + '</td>' : '') + '<td>' + d.f[i] + '</td></tr>'; }).join('') + '</table>';
    if (two && SZ[k] < d.r * .9) h += '<p style="color:var(--m)">' + d.n + ' is ' + d.r + '× wider than Earth – drawn smaller here so both fit.</p>';
    h += '<h3>' + (k === 'earth' ? 'Why life works here' : 'Why is ' + d.n + ' not suitable for life?') + '</h3><div class="row chk">' + CK.map(function (c, i) { var ok = d.k[i] === '1'; return '<span class="' + (ok ? 'ok' : 'no') + '">' + (ok ? '✔ ' : '✖ ') + c + '</span>'; }).join('') + '</div><p>' + d.why + '</p>';
    if (two) h += '<p style="color:var(--m)">Tip: switch on “Cut open the core” to compare the insides too.</p>';
    h += '<h3>Test yourself</h3>' + quiz() + '<p style="margin-top:14px"><a href="index12.html" style="color:var(--c)">🛠 Now build your own Earth in the Skill Lab →</a></p>';
    ui.innerHTML = h; ui.scrollTop = st;
  }
  ui.addEventListener('click', function (ev) {
    var b = ev.target.closest('button'); if (!b || b.disabled) return;
    var a = b.dataset.a, v = b.dataset.v, i = +b.dataset.i;
    if (a === 'p') { sel = v; hi = -1; } else if (a === 'm') mode = v; else if (a === 'cut') { cutOn = !cutOn; hi = -1; }
    else if (a === 'L') hi = hi === i ? -1 : i;
    else if (a === 'qs') q = { i: 0, s: 0, a: -1 };
    else if (a === 'qa') { q.a = i; if (i === QZ[q.i][2]) q.s++; }
    else if (a === 'qn') { q.i++; q.a = -1; if (q.i >= QZ.length && q.s >= 4) q.xp = E.award('discover', 20, 'Earth & Neighbours quiz'); }
    layout(); render();
  });
  layout(); render();
})();
</script>
<script src="script3.js" defer></script>
</body>
</html>
