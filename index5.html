<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Aditya-L1 Solar Observatory</title>
    <style>
        html,
        body {
            margin: 0;
            background: #02030a
        }

        body {
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        /* Demo only: give the widget a size. On your site, put .vk inside any element that has a height. */
        .demo {
            height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
            height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px))
        }

        /* ===== ADITYA-L1 WIDGET CSS (copy) ===== */
        .vk {
            position: relative;
            width: 100%;
            height: 100%;
            min-height: 320px;
            background: #000;
            overflow: hidden;
            color: #f2efe6;
            font-family: Georgia, "Times New Roman", serif;
            touch-action: pan-y
        }

        .vk canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none
        }

        .vk [hidden] {
            display: none !important
        }

        .vk .vk-t {
            position: absolute;
            top: 62px;
            left: 18px;
            right: 18px;
            pointer-events: none;
            text-shadow: 0 2px 12px #000;
            background: linear-gradient(90deg, rgba(2, 5, 14, .72), rgba(2, 5, 14, 0));
            padding: 12px 14px;
            border-left: 2px solid #e3b84a;
            border-radius: 0 12px 12px 0;
            max-width: 560px;
            box-sizing: border-box
        }

        .vk .vk-t b {
            display: block;
            font-weight: 400;
            font-size: clamp(20px, 4.5vw, 30px)
        }

        .vk .vk-t span {
            font-size: 14px;
            color: #c9c5b8
        }

        .vk .vk-ui {
            position: absolute;
            left: 14px;
            right: 14px;
            bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            pointer-events: none;
            padding: 10px 12px;
            border: 1px solid rgba(255, 255, 255, .13);
            border-radius: 16px;
            background: linear-gradient(120deg, rgba(5, 9, 18, .82), rgba(5, 9, 18, .35));
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px)
        }

        .vk .vk-s {
            font-size: 15px;
            color: #e3b84a;
            text-shadow: 0 1px 6px #000;
            max-width: 50%
        }

        .vk .vk-ui-btns {
            display: flex;
            gap: 8px;
            pointer-events: auto
        }

        .vk button {
            pointer-events: auto;
            font: inherit;
            font-size: 15px;
            color: #f2efe6;
            background: rgba(5, 6, 10, .6);
            border: 1px solid rgba(242, 239, 230, .25);
            border-radius: 999px;
            padding: 9px 18px;
            cursor: pointer
        }

        .vk button:hover {
            border-color: #e3b84a
        }

        .vk button:focus-visible {
            outline: 2px solid #e3b84a;
            outline-offset: 2px
        }

        /* ===== CUSTOM VISIBLE SCROLLBARS FOR CHIPS & CARD SECTIONS ===== */
        .vk .vk-chips {
            position: absolute;
            left: 14px;
            right: 14px;
            bottom: 78px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: thin;
            scrollbar-color: #e3b84a rgba(5, 9, 18, .6);
            padding: 7px 2px
        }

        .vk .vk-chips::-webkit-scrollbar {
            height: 6px;
            display: block
        }

        .vk .vk-chips::-webkit-scrollbar-track {
            background: rgba(5, 9, 18, .4);
            border-radius: 3px
        }

        .vk .vk-chips::-webkit-scrollbar-thumb {
            background: #e3b84a;
            border-radius: 3px
        }

        .vk .vk-chip {
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            padding: 9px 14px;
            font-size: 13px;
            background: rgba(9, 16, 28, .62);
            -webkit-backdrop-filter: blur(16px) saturate(130%);
            backdrop-filter: blur(16px) saturate(130%);
            box-shadow: 0 4px 16px rgba(0, 0, 0, .18)
        }

        .vk .vk-chip i {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            box-shadow: 0 0 8px currentColor
        }

        .vk .vk-chip.on {
            background: rgba(255, 255, 255, .14);
            border-color: var(--c)
        }

        .vk .vk-card {
            position: absolute;
            left: 14px;
            right: 14px;
            bottom: 138px;
            max-height: 56%;
            overflow-y: auto;
            padding: 20px 20px 16px;
            border-radius: 20px;
            overflow-x: hidden;
            scrollbar-width: thin;
            scrollbar-color: #e3b84a rgba(13, 22, 36, .6);
            background: linear-gradient(145deg, rgba(13, 22, 36, .68), rgba(4, 8, 17, .48));
            -webkit-backdrop-filter: blur(22px) saturate(135%);
            backdrop-filter: blur(22px) saturate(135%);
            border: 1px solid rgba(220, 235, 255, .20);
            box-shadow: 0 12px 34px rgba(0, 0, 0, .28), inset 0 1px 0 rgba(255, 255, 255, .07)
        }

        .vk .vk-card::-webkit-scrollbar {
            width: 6px
        }

        .vk .vk-card::-webkit-scrollbar-track {
            background: rgba(13, 22, 36, .4);
            border-radius: 3px
        }

        .vk .vk-card::-webkit-scrollbar-thumb {
            background: #e3b84a;
            border-radius: 3px
        }

        .vk .vk-card::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            height: 3px;
            width: 100%;
            background: linear-gradient(90deg, var(--c), transparent);
            transform-origin: left
        }

        .vk .vk-card.on {
            animation: vkIn .55s cubic-bezier(.2, .9, .2, 1) both
        }

        .vk .vk-card.on::before {
            animation: vkLine .9s .1s cubic-bezier(.2, .9, .2, 1) both
        }

        .vk .vk-x {
            position: absolute;
            top: 10px;
            right: 12px;
            width: 30px;
            height: 30px;
            padding: 0;
            border-radius: 50%;
            font-size: 18px;
            line-height: 1
        }

        .vk .vk-k {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: var(--c)
        }

        .vk .vk-k i {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--c);
            box-shadow: 0 0 10px var(--c)
        }

        .vk .vk-card.on .vk-k {
            animation: vkUp .5s .08s both
        }

        .vk .vk-n {
            margin: 6px 0 8px;
            font-weight: 400;
            font-size: 25px;
            letter-spacing: .01em;
            padding-right: 30px
        }

        .vk .vk-n span {
            display: inline-block;
            animation: vkLetter .5s calc(.12s + var(--i)*.03s) both
        }

        .vk .vk-d {
            margin: 0;
            font-size: 15px;
            line-height: 1.55;
            color: rgba(235, 240, 248, .88);
            min-height: 4.6em
        }

        .vk .vk-d.typing::after {
            content: "";
            display: inline-block;
            width: 2px;
            height: 1em;
            margin-left: 2px;
            vertical-align: -2px;
            background: var(--c);
            animation: vkBlink .7s steps(2) infinite
        }

        .vk .vk-st {
            display: flex;
            gap: 10px;
            margin-top: 14px
        }

        .vk .vk-st div {
            flex: 1;
            padding: 8px 10px;
            border-radius: 10px;
            background: rgba(255, 255, 255, .06);
            border: 1px solid rgba(255, 255, 255, .09);
            animation: vkUp .5s calc(.45s + var(--i)*.1s) both
        }

        .vk .vk-st small {
            display: block;
            font-size: 11px;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: #a9a69c
        }

        .vk .vk-st b {
            font-weight: 400;
            font-size: 15px;
            color: var(--c)
        }

        @media(min-width:760px) {
            .vk .vk-card {
                left: auto;
                right: 24px;
                top: 110px;
                bottom: auto;
                width: 340px;
                max-height: calc(100% - 230px)
            }

            .vk .vk-chips {
                bottom: 78px
            }
        }

        @media(max-width:520px) {
            .vk .vk-n {
                font-size: 22px
            }

            .vk .vk-d {
                font-size: 14px;
                min-height: 0
            }

            .vk .vk-card {
                bottom: 136px;
                max-height: 48%;
                padding: 16px
            }

            .vk .vk-st {
                gap: 6px
            }

            .vk .vk-st b {
                font-size: 13px
            }

            .vk .vk-t span {
                font-size: 12px
            }

            .vk .vk-ui button {
                padding: 8px 12px;
                font-size: 13px
            }

            .vk .vk-s {
                font-size: 12px
            }
        }

        .vk .vk-m {
            margin: 12px 0 0;
            font-size: 14px;
            line-height: 1.5;
            color: rgba(235, 240, 248, .82)
        }

        .vk .vk-m b {
            display: block;
            font-weight: 400;
            font-size: 11px;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: #a9a69c;
            margin-bottom: 2px
        }

        .vk .vk-src {
            margin: 10px 0 0;
            font-size: 11px;
            line-height: 1.4;
            color: #8f8c82
        }

        @keyframes vkIn {
            from {
                opacity: 0;
                transform: translateY(18px) scale(.96);
                filter: blur(6px)
            }

            to {
                opacity: 1;
                transform: none;
                filter: none
            }
        }

        @keyframes vkUp {
            from {
                opacity: 0;
                transform: translateY(10px)
            }

            to {
                opacity: 1;
                transform: none
            }
        }

        @keyframes vkLine {
            from {
                transform: scaleX(0)
            }

            to {
                transform: scaleX(1)
            }
        }

        @keyframes vkLetter {
            from {
                opacity: 0;
                transform: translateY(.5em);
                filter: blur(4px)
            }

            to {
                opacity: 1;
                transform: none;
                filter: none
            }
        }

        @keyframes vkBlink {
            50% {
                opacity: 0
            }
        }

        @media(prefers-reduced-motion:reduce) {
            .vk * {
                animation: none !important
            }
        }
    </style>
    <script src="script2.js"></script>
    <script src="script1.js"></script>
    <style>
        /* ===== Go Back button ===== */
        .back-btn {
            --back-accent: #e3b84a;
            position: fixed;
            top: calc(env(safe-area-inset-top, 0px) + 12px);
            left: max(14px, env(safe-area-inset-left, 0px));
            z-index: 1000;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            height: 36px;
            padding: 0 15px 0 11px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, .18);
            background: rgba(8, 14, 26, .55);
            -webkit-backdrop-filter: blur(12px) saturate(140%);
            backdrop-filter: blur(12px) saturate(140%);
            color: #eef2fb;
            font: 600 13px/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            letter-spacing: .04em;
            text-decoration: none;
            white-space: nowrap;
            box-shadow: 0 4px 18px rgba(0, 0, 0, .4);
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            transition: background .2s, border-color .2s, color .2s, transform .2s
        }

        .back-btn svg {
            width: 16px;
            height: 16px;
            flex: none;
            transition: transform .2s
        }

        .back-btn:hover {
            background: rgba(8, 14, 26, .82);
            border-color: var(--back-accent);
            color: #fff
        }

        .back-btn:hover svg {
            transform: translateX(-3px)
        }

        .back-btn:focus-visible {
            outline: 2px solid var(--back-accent);
            outline-offset: 3px
        }

        .back-btn:active {
            transform: scale(.96)
        }

        @media (prefers-reduced-motion:reduce) {

            .back-btn,
            .back-btn svg {
                transition: none
            }
        }
    </style>
</head>

<body>
    <a class="back-btn" href="index2.html" aria-label="Go back to the home page"><svg viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15 6l-6 6 6 6" />
        </svg><span>Go Back</span></a>

    <div class="demo">
        <!-- ===== ADITYA-L1 WIDGET HTML (copy) ===== -->
        <div class="vk" id="aditya">
            <div class="vk-t"><b>Aditya-L1: India’s solar observatory</b><span>Halo orbit at the Sun–Earth L1
                    point</span></div>
            <div class="vk-ui">
                <span class="vk-s">Loading…</span>
                <div class="vk-ui-btns">
                    <button type="button" class="vk-pause">Pause Orbit</button>
                    <button type="button" class="vk-r">Highlight parts</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== ADITYA-L1 WIDGET JS (copy) ===== -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        function AdityaL1(root) {
            const sEl = root.querySelector('.vk-s'), setS = t => { if (sEl) sEl.textContent = t; };
            const canvas = document.createElement('canvas'); root.insertBefore(canvas, root.firstChild);
            const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5)); renderer.shadowMap.enabled = true; renderer.outputColorSpace = THREE.SRGBColorSpace || renderer.outputColorSpace;
            const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(42, 1, .1, 4000);
            const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
            let isPaused = false;
            const TAU = Math.PI * 2, rnd = Math.random, gs = () => rnd() + rnd() + rnd() - 1.5, clamp = (v, a, b) => Math.min(b, Math.max(a, v));
            const cv = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };

            // ================= SPACE: galaxy sky, stars, distant planet =================
            function skyTex() {
                const W = 2048, H = 1024, c = cv(W, H), x = c.getContext('2d');
                x.fillStyle = '#01020a'; x.fillRect(0, 0, W, H); x.globalCompositeOperation = 'lighter';
                const blob = (px, py, r, rgb, a) => { const g = x.createRadialGradient(px, py, 0, px, py, r); g.addColorStop(0, 'rgba(' + rgb + ',' + a + ')'); g.addColorStop(1, 'rgba(' + rgb + ',0)'); x.fillStyle = g; x.fillRect(px - r, py - r, 2 * r, 2 * r); };
                const pal = ['150,175,255', '255,228,190', '190,160,255', '255,255,255', '255,160,130'];
                const mid = u => H / 2 + 130 * Math.sin(u / W * TAU + .6);
                for (let i = 0; i < 3200; i++) { const u = rnd() * W; blob(u, mid(u) + gs() * 85, 12 + rnd() * 46, pal[(rnd() * 5) | 0], .012 + rnd() * .035); }
                for (let i = 0; i < 160; i++) { const u = W * (.25 + rnd() * .18); blob(u, mid(u) + gs() * 40, 50 + rnd() * 90, '255,205,150', .02 + rnd() * .03); }
                x.globalCompositeOperation = 'source-over';
                for (let i = 0; i < 500; i++) { const u = rnd() * W; blob(u, mid(u) + gs() * 34, 10 + rnd() * 40, '0,0,6', .08 + rnd() * .16); }
                x.globalCompositeOperation = 'lighter';
                for (let i = 0; i < 5000; i++) { x.fillStyle = 'rgba(' + pal[(rnd() * 5) | 0] + ',' + (.25 + rnd() * .75) + ')'; const s = rnd() < .06 ? 2 : 1; x.fillRect(rnd() * W, rnd() * H, s, s); }
                for (let g = 0; g < 7; g++) {
                    const gr = 14 + rnd() * 22; x.save(); x.translate(rnd() * W, H * .12 + rnd() * H * .76); x.rotate(rnd() * Math.PI); x.scale(1, .38);
                    blob(0, 0, gr * 1.6, '170,185,255', .35); blob(0, 0, gr * .5, '255,240,210', .7);
                    for (let t = .5; t < 12; t += .25)for (const o of [0, Math.PI]) { const a = t + o, r = 1.2 * t * gr / 6; blob(Math.cos(a) * r, Math.sin(a) * r, gr * .18, '190,205,255', .22); }
                    x.restore();
                }
                return new THREE.CanvasTexture(c);
            }
            const sky = new THREE.Mesh(new THREE.SphereGeometry(3000, 48, 32), new THREE.MeshBasicMaterial({ map: skyTex(), side: THREE.BackSide, depthWrite: false, fog: false }));
            sky.rotation.set(.6, .4, .15); scene.add(sky);
            function stars(n, size, op) {
                const p = new Float32Array(n * 3), col = new Float32Array(n * 3), c = new THREE.Color();
                for (let i = 0; i < n; i++) {
                    const u = rnd() * 2 - 1, t = rnd() * TAU, r = Math.sqrt(1 - u * u); p[i * 3] = 2800 * r * Math.cos(t); p[i * 3 + 1] = 2800 * u; p[i * 3 + 2] = 2800 * r * Math.sin(t);
                    c.setHSL(rnd() < .5 ? .6 : .08, .5 * rnd(), .7 + .3 * rnd()); col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
                }
                const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(p, 3)); g.setAttribute('color', new THREE.BufferAttribute(col, 3));
                scene.add(new THREE.Points(g, new THREE.PointsMaterial({ size, sizeAttenuation: false, vertexColors: true, transparent: true, opacity: op, depthWrite: false, fog: false })));
            }
            stars(5000, 1.3, .8); stars(350, 2.6, 1);
            {
                const c = cv(8, 64), x = c.getContext('2d');['#cdb27f', '#e3cfa0', '#b99c68', '#dcc592', '#a88b5c', '#cfb784', '#e6d3a6', '#bda06c'].forEach((col, i) => { x.fillStyle = col; x.fillRect(0, i * 8, 8, 8); });
                const pg = new THREE.Group(); pg.position.set(-900, 260, -1300);
                pg.add(new THREE.Mesh(new THREE.SphereGeometry(38, 32, 24), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c) })));
                const r = new THREE.Mesh(new THREE.RingGeometry(55, 92, 64), new THREE.MeshBasicMaterial({ color: 0xcbb68c, side: THREE.DoubleSide, transparent: true, opacity: .6 })); r.rotation.x = 1.2; pg.add(r); scene.add(pg);
            }

            // ================= THE SUN: animated plasma shader, corona, rays, prominences =================
            const RS = 45, RO = 82, INC = .12, OMEGA = .03;
            const sg2 = new THREE.Group(); sg2.rotation.z = .35; scene.add(sg2);
            const sunMat = new THREE.ShaderMaterial({
                uniforms: { uT: { value: 0 } },
                vertexShader: `varying vec3 vP;varying vec3 vN;varying vec3 vV;
void main(){vP=position;vN=normalize(normalMatrix*normal);vec4 mv=modelViewMatrix*vec4(position,1.);vV=normalize(-mv.xyz);gl_Position=projectionMatrix*mv;}`,
                fragmentShader: `varying vec3 vP;varying vec3 vN;varying vec3 vV;uniform float uT;
float hs(vec3 p){p=fract(p*.3183099+.1);p*=17.;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
float vn(vec3 x){vec3 i=floor(x),f=fract(x);f=f*f*(3.-2.*f);
 return mix(mix(mix(hs(i),hs(i+vec3(1,0,0)),f.x),mix(hs(i+vec3(0,1,0)),hs(i+vec3(1,1,0)),f.x),f.y),
  mix(mix(hs(i+vec3(0,0,1)),hs(i+vec3(1,0,1)),f.x),mix(hs(i+vec3(0,1,1)),hs(i+vec3(1,1,1)),f.x),f.y),f.z);}
float fbm(vec3 p){float a=.5,s=0.;for(int i=0;i<4;i++){s+=a*vn(p);p=p*2.03+vec3(1.7,9.2,3.1);a*=.5;}return s;}
void main(){
 vec3 p=normalize(vP);float t=uT*.05;
 float cells=fbm(p*3.+vec3(0.,t,0.));
 float gran=fbm(p*16.+vec3(t*2.,-t,t*1.5)+cells);
 float flow=fbm(p*7.+cells*2.+vec3(t*3.,0.,-t));
 float spot=smoothstep(.64,.76,fbm(p*2.4+vec3(4.,t*.4,1.)));
 float heat=clamp(-.02+1.1*flow+.8*(gran-.5)-.6*spot,0.,1.3);
 vec3 c0=vec3(.5,.06,0.),c1=vec3(1.,.36,.02),c2=vec3(1.,.7,.14),c3=vec3(1.,.95,.72);
 vec3 col=mix(c0,c1,smoothstep(0.,.4,heat));col=mix(col,c2,smoothstep(.35,.75,heat));col=mix(col,c3,smoothstep(.75,1.2,heat));
 col*=1.-.8*spot;
 float mu=clamp(dot(normalize(vN),normalize(vV)),0.,1.);
 col*=mix(.3,1.,pow(mu,.4));
 col+=vec3(1.,.4,.08)*pow(1.-mu,3.)*.3;
 gl_FragColor=vec4(col*.82,1.);}`});
            sg2.add(new THREE.Mesh(new THREE.SphereGeometry(RS, 96, 64), sunMat));
            function glowTex(stops) { const s = 256, c = cv(s, s), x = c.getContext('2d'), g = x.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2); stops.forEach(a => g.addColorStop(a[0], a[1])); x.fillStyle = g; x.fillRect(0, 0, s, s); return new THREE.CanvasTexture(c); }
            function raysTex() {
                const s = 512, c = cv(s, s), x = c.getContext('2d'); x.translate(s / 2, s / 2); x.globalCompositeOperation = 'lighter';
                for (let i = 0; i < 260; i++) {
                    const l = s * (.2 + rnd() * .3), w = .004 + rnd() * .012, g = x.createLinearGradient(0, 0, l, 0);
                    g.addColorStop(0, 'rgba(255,200,120,' + (.08 + rnd() * .14) + ')'); g.addColorStop(1, 'rgba(255,120,30,0)');
                    x.save(); x.rotate(rnd() * TAU); x.fillStyle = g; x.beginPath(); x.moveTo(s * .08, -l * w); x.lineTo(l, 0); x.lineTo(s * .08, l * w); x.fill(); x.restore();
                }
