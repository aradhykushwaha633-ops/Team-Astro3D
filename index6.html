<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Aryabhata Satellite & Realistic Earth Explorer</title>
    <style>
        html,
        body {
            margin: 0;
            background: #010206;
            overflow: hidden;
        }

        body {
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        .demo {
            height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
            height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
        }

        /* ===== WIDGET CSS ===== */
        .vk {
            position: relative;
            width: 100%;
            height: 100%;
            min-height: 320px;
            background: #010206;
            overflow: hidden;
            color: #f2efe6;
            font-family: Georgia, "Times New Roman", serif;
            touch-action: pan-y;
        }

        .vk canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .vk [hidden] {
            display: none !important;
        }

        .vk .vk-t {
            position: absolute;
            top: 16px;
            left: 18px;
            right: 18px;
            pointer-events: none;
            text-shadow: 0 2px 12px #000;
            background: linear-gradient(90deg, rgba(2, 5, 14, .78), rgba(2, 5, 14, 0));
            padding: 12px 14px;
            border-left: 2px solid #38bdf8;
            border-radius: 0 12px 12px 0;
            max-width: 560px;
            box-sizing: border-box;
        }

        .vk .vk-t b {
            display: block;
            font-weight: 400;
            font-size: clamp(18px, 4vw, 26px);
        }

        .vk .vk-t span {
            font-size: 13px;
            color: #93c5fd;
        }

        .vk .vk-hud {
            position: absolute;
            top: 16px;
            right: 18px;
            pointer-events: none;
            background: rgba(5, 10, 20, 0.7);
            border: 1px solid rgba(56, 189, 248, 0.3);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            padding: 10px 14px;
            border-radius: 12px;
            font-family: monospace;
            font-size: 11px;
            color: #38bdf8;
            text-shadow: 0 0 6px rgba(56, 189, 248, 0.4);
        }

        .vk .vk-hud div {
            margin-bottom: 3px;
        }

        .vk .vk-hud div:last-child {
            margin-bottom: 0;
        }

        .vk .vk-ui {
            position: absolute;
            left: 14px;
            right: 14px;
            bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            pointer-events: none;
            padding: 10px 12px;
            border: 1px solid rgba(255, 255, 255, .13);
            border-radius: 16px;
            background: linear-gradient(120deg, rgba(5, 9, 18, .82), rgba(5, 9, 18, .35));
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
        }

        .vk .vk-s {
            font-size: 14px;
            color: #38bdf8;
            text-shadow: 0 1px 6px #000;
            max-width: 46%;
        }

        .vk .vk-ui-btns {
            display: flex;
            gap: 8px;
            align-items: center;
            pointer-events: auto;
        }

        .vk button {
            pointer-events: auto;
            font: inherit;
            font-size: 14px;
            color: #f2efe6;
            background: rgba(5, 6, 10, .6);
            border: 1px solid rgba(242, 239, 230, .25);
            border-radius: 999px;
            padding: 8px 16px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .vk button:hover {
            border-color: #38bdf8;
            background: rgba(56, 189, 248, 0.15);
        }

        /* the blue "See Inside" button */
        .vk button.vk-see {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            font-weight: 700;
            letter-spacing: .02em;
            color: #fff;
            padding: 11px 22px;
            border: 1px solid #9ad0ff;
            background: linear-gradient(180deg, #46a6ff 0%, #1a66e0 100%);
            box-shadow: 0 0 0 0 rgba(70, 166, 255, .6), 0 4px 18px rgba(26, 102, 224, .55), inset 0 1px 0 rgba(255, 255, 255, .45);
            animation: vk-pulse 2.4s ease-out infinite;
        }

        .vk button.vk-see:hover {
            background: linear-gradient(180deg, #62b4ff 0%, #2b78f5 100%);
            border-color: #cfe8ff;
        }

        .vk button.vk-see i {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid #fff;
            box-sizing: border-box;
            position: relative;
            flex: none;
        }

        .vk button.vk-see i::after {
            content: "";
            position: absolute;
            inset: 2px;
            border-radius: 50%;
            background: #fff;
        }

        .vk button.vk-see.open {
            animation: none;
            background: linear-gradient(180deg, #2b78f5 0%, #1146a8 100%);
        }

        @keyframes vk-pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(70, 166, 255, .55), 0 4px 18px rgba(26, 102, 224, .55), inset 0 1px 0 rgba(255, 255, 255, .45);
            }

            70%,
            100% {
                box-shadow: 0 0 0 14px rgba(70, 166, 255, 0), 0 4px 18px rgba(26, 102, 224, .55), inset 0 1px 0 rgba(255, 255, 255, .45);
            }
        }

        .vk .vk-chips {
            position: absolute;
            left: 14px;
            right: 14px;
            bottom: 78px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: thin;
            scrollbar-color: #38bdf8 rgba(5, 9, 18, .6);
            padding: 7px 2px;
        }

        .vk .vk-chips::-webkit-scrollbar {
            height: 6px;
        }

        .vk .vk-chips::-webkit-scrollbar-thumb {
            background: #38bdf8;
            border-radius: 3px;
        }

        .vk .vk-chip {
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            padding: 9px 14px;
            font-size: 13px;
            background: rgba(9, 16, 28, .62);
            -webkit-backdrop-filter: blur(16px);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 999px;
            cursor: pointer;
            color: #f2efe6;
            flex: none;
        }

        .vk .vk-chip i {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            box-shadow: 0 0 8px currentColor;
        }

        .vk .vk-chip.on {
            background: rgba(56, 189, 248, 0.2);
            border-color: var(--c);
        }

        /* transparent information box: part name, information, source - nothing else */
        .vk .vk-card {
            position: absolute;
            left: 14px;
            right: 14px;
            bottom: 138px;
            max-height: 40%;
            overflow-y: auto;
            padding: 16px 18px 14px;
            border-radius: 16px;
            background: rgba(8, 14, 26, .38);
            -webkit-backdrop-filter: blur(14px);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, .16);
            border-left: 3px solid var(--c, #38bdf8);
            box-shadow: 0 10px 30px rgba(0, 0, 0, .28);
            animation: vk-in .25s ease-out;
        }

        @keyframes vk-in {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        .vk .vk-x {
            position: absolute;
            top: 10px;
            right: 12px;
            width: 26px;
            height: 26px;
            padding: 0;
            border-radius: 50%;
            font-size: 16px;
            line-height: 1;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            cursor: pointer;
        }

        .vk .vk-n {
            margin: 0 30px 7px 0;
            font-weight: 400;
            font-size: 20px;
            color: #fff;
        }

        .vk .vk-d {
            margin: 0;
            font-size: 14px;
            line-height: 1.55;
            color: rgba(235, 240, 248, .92);
        }

        .vk .vk-src {
            margin: 10px 0 0;
            font-size: 10.5px;
            line-height: 1.4;
            color: rgba(200, 205, 215, .62);
        }

        .vk .vk-load {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            background: radial-gradient(ellipse at center, #050a18 0%, #010206 70%);
            color: #93c5fd;
            font-size: 14px;
            letter-spacing: .08em;
            z-index: 5;
            pointer-events: none;
        }

        .vk .vk-load span {
            display: block;
            width: 200px;
            height: 3px;
            border-radius: 2px;
            background: rgba(147, 197, 253, .18);
            overflow: hidden;
        }

        .vk .vk-load i {
            display: block;
            height: 100%;
            width: 0;
            background: linear-gradient(90deg, #38bdf8, #6aa5ff);
            transition: width .2s;
        }

        @media(min-width:760px) {
            .vk .vk-card {
                left: auto;
                right: 24px;
                top: 110px;
                bottom: auto;
                width: 320px;
                max-height: calc(100% - 200px);
            }

            .vk .vk-s {
                max-width: 52%;
            }
        }

        @media(max-width:560px) {
            .vk .vk-hud {
                display: none;
            }

            .vk .vk-s {
                font-size: 12px;
                max-width: 38%;
            }

            .vk button {
                padding: 8px 12px;
                font-size: 13px;
            }

            .vk button.vk-see {
                padding: 10px 16px;
            }
        }
    </style>
<script src="script2.js"></script>
<script src="script1.js"></script>
</head>

<body>

    <div class="demo">
        <div class="vk" id="aryabhata-widget">
            <div class="vk-t">
                <b>Aryabhata: India’s First Satellite</b>
                <span>Low Earth Orbit · Launched 19 April 1975</span>
            </div>
            <div class="vk-hud" id="telemetry-hud">
                <div>ALT: <b>~600 km</b> (LEO)</div>
                <div>INC: <b>50.7°</b></div>
                <div>MASS: <b>360 kg</b></div>
                <div>STATUS: <span style="color:#4ade80">NOMINAL</span></div>
            </div>
            <div class="vk-ui">
                <span class="vk-s">Loading Earth &amp; space…</span>
                <div class="vk-ui-btns">
                    <button type="button" class="vk-pause">Pause Orbit</button>
                    <button type="button" class="vk-see" aria-pressed="false"><i></i>See Inside</button>
                </div>
            </div>
            <div class="vk-load">Preparing Earth &amp; the night sky…<span><i></i></span></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        /* ===================== GLSL LIBRARY ===================== */
        const GLSL = {};

        GLSL.common = `
const float PI = 3.14159265359;
float h31(vec3 p){ p = fract(p*0.3183099 + vec3(0.1)); p *= 17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float vn(vec3 x){
  vec3 i = floor(x); vec3 f = fract(x); f = f*f*(3.0-2.0*f);
  return mix(mix(mix(h31(i), h31(i+vec3(1.0,0.0,0.0)), f.x),
                 mix(h31(i+vec3(0.0,1.0,0.0)), h31(i+vec3(1.0,1.0,0.0)), f.x), f.y),
             mix(mix(h31(i+vec3(0.0,0.0,1.0)), h31(i+vec3(1.0,0.0,1.0)), f.x),
                 mix(h31(i+vec3(0.0,1.0,1.0)), h31(i+vec3(1.0,1.0,1.0)), f.x), f.y), f.z);
}
float fbm(vec3 p){
  float a = 0.5; float s = 0.0;
  for (int i = 0; i < 6; i++){ s += a*vn(p); p = p*2.02 + vec3(1.7,9.2,3.1); a *= 0.5; }
  return s/0.984375;
}
float fbm3(vec3 p){
  float a = 0.5; float s = 0.0;
  for (int i = 0; i < 3; i++){ s += a*vn(p); p = p*2.03 + vec3(4.1,2.3,7.7); a *= 0.5; }
  return s/0.875;
}
vec3 dirFromUv(vec2 uv){
  float phi = uv.x*2.0*PI; float th = (1.0-uv.y)*PI;
  return vec3(-cos(phi)*sin(th), cos(th), sin(phi)*sin(th));
}
`;

        GLSL.bakeVert = `
varying vec2 vUv;
void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
`;

        /* strip rendering: only the x-range [uX0,uX1) is computed per pass */
        GLSL.bakeHead = `
varying vec2 vUv;
uniform float uX0; uniform float uX1;
`;

        /* ---------- deep-space sky: Milky Way, dust lanes, nebulae ---------- */
        GLSL.skyBake = GLSL.bakeHead + GLSL.common + `
void main(){
  if (vUv.x < uX0 || vUv.x >= uX1) discard;
  vec3 d = dirFromUv(vUv);
  vec3 col = vec3(0.0025, 0.0045, 0.012);
  // large-scale colour wash of the background
  float w1 = fbm3(d*1.7 + vec3(2.0,5.0,9.0));
  float w2 = fbm3(d*2.3 + vec3(8.0,1.0,4.0));
  col += vec3(0.010,0.012,0.034)*smoothstep(0.30,0.85,w1);
  col += vec3(0.024,0.007,0.026)*smoothstep(0.45,0.90,w2);

  // galactic plane
  vec3 gN = normalize(vec3(0.36, 0.86, 0.36));
  vec3 gX = normalize(cross(gN, vec3(0.0,0.0,1.0)));
  vec3 gY = cross(gN, gX);
  float b = dot(d, gN);
  float lon = atan(dot(d,gY), dot(d,gX));
  float ang = abs(lon);
  float coreW = exp(-pow(ang/0.85, 2.0));
  float n1 = fbm(d*3.2 + vec3(1.0,2.0,3.0));
  float n2 = fbm(d*7.5 + vec3(9.0,4.0,1.0));
  float band = exp(-pow(b/0.17, 2.0)) * (0.35 + 1.15*n1);
  float halo = exp(-pow(b/0.46, 2.0)) * 0.22 * (0.4 + n2);
  float bulge = coreW * exp(-pow(b/0.30, 2.0));
  // dust lanes
  float dust = smoothstep(0.50, 0.78, fbm(d*5.2 + vec3(5.0,1.0,3.0)));
  dust *= exp(-pow((b+0.015)/0.085, 2.0));
  float dust2 = smoothstep(0.55, 0.80, fbm(d*11.0 + vec3(2.0,8.0,6.0))) * exp(-pow(b/0.2, 2.0));
  vec3 armCol = mix(vec3(0.46,0.56,0.95), vec3(0.85,0.80,0.95), n2);
  vec3 coreCol = vec3(1.0, 0.78, 0.52);
  vec3 mw = armCol*(band + halo) + coreCol*bulge*(0.55 + 0.6*n1);
  mw *= (1.0 - 0.88*dust) * (1.0 - 0.45*dust2);
  col += mw * 0.62;
  // unresolved star clouds (fine grain, only inside the band)
  float grain = pow(fbm(d*95.0), 3.5) * 2.2 + pow(vn(d*260.0), 6.0) * 2.0;
  col += vec3(0.9,0.92,1.0) * grain * band * 0.55 * (1.0 - 0.8*dust);

  // emission nebulae
  vec3 nc1 = normalize(vec3(-0.55, 0.20, 0.80));
  vec3 nc2 = normalize(vec3(0.70, -0.35, 0.62));
  vec3 nc3 = normalize(vec3(0.15, 0.62, -0.77));
  vec3 nc4 = normalize(vec3(-0.78, -0.48, -0.40));
  float a1 = acos(clamp(dot(d,nc1), -1.0, 1.0));
  float a2 = acos(clamp(dot(d,nc2), -1.0, 1.0));
  float a3 = acos(clamp(dot(d,nc3), -1.0, 1.0));
  float a4 = acos(clamp(dot(d,nc4), -1.0, 1.0));
  float f1 = fbm(d*6.0 + vec3(3.0,3.0,1.0));
  float f2 = fbm(d*5.0 + vec3(7.0,2.0,8.0));
  float f3 = fbm(d*7.0 + vec3(1.0,9.0,5.0));
  float f4 = fbm(d*5.5 + vec3(4.0,6.0,2.0));
  col += vec3(0.95,0.22,0.46) * smoothstep(0.40,0.82,f1) * exp(-pow(a1/0.36,2.0)) * 0.55;
  col += vec3(0.22,0.50,0.95) * smoothstep(0.42,0.85,f2) * exp(-pow(a2/0.42,2.0)) * 0.50;
  col += vec3(0.95,0.52,0.18) * smoothstep(0.40,0.84,f3) * exp(-pow(a3/0.30,2.0)) * 0.50;
  col += vec3(0.30,0.85,0.70) * smoothstep(0.44,0.86,f4) * exp(-pow(a4/0.34,2.0)) * 0.40;
  // faint diffuse star dust everywhere
  float dustStars = step(0.9965, h31(floor(d*230.0))) * 0.5;
  col += vec3(0.85,0.9,1.0) * dustStars * 0.25;

  col = pow(clamp(col, 0.0, 1.0), vec3(0.92));
  gl_FragColor = vec4(col, 1.0);
}
`;

        /* ---------- procedural Earth (fallback when no photo textures are reachable) ---------- */
        GLSL.earthTerrain = `
float landH(vec3 d){
  vec3 p = d*1.55;
  vec3 w = vec3(fbm3(p*1.7 + vec3(3.1,0.0,0.0)), fbm3(p*1.7 + vec3(0.0,7.7,0.0)), fbm3(p*1.7 + vec3(0.0,0.0,11.3)));
  p += (w - 0.5)*1.0;
  float base = fbm(p + vec3(0.5));
  float cont = base*1.12 + 0.10*fbm3(p*3.3 + vec3(2.0)) + 0.05*d.y;
  return cont;
}
const float SEA = 0.735;
`;

        GLSL.earthBakeCommon = GLSL.bakeHead + GLSL.common + GLSL.earthTerrain + `
uniform float uMode;
vec3 landColor(vec3 d, float h, float temp, float moist, float e){
  vec3 forest   = vec3(0.075,0.205,0.075);
  vec3 rain     = vec3(0.035,0.150,0.050);
  vec3 grass    = vec3(0.300,0.380,0.140);
  vec3 savanna  = vec3(0.520,0.470,0.230);
  vec3 desert   = vec3(0.760,0.610,0.380);
  vec3 desertR  = vec3(0.690,0.440,0.270);
  vec3 tundra   = vec3(0.380,0.400,0.330);
  vec3 rock     = vec3(0.340,0.310,0.280);
  vec3 snow     = vec3(0.930,0.950,0.980);
  float wet = smoothstep(0.38, 0.66, moist);
  vec3 veg = mix(savanna, grass, smoothstep(0.35,0.55,moist));
  veg = mix(veg, forest, smoothstep(0.50,0.72,moist));
  veg = mix(veg, rain, smoothstep(0.62,0.85,moist)*smoothstep(0.55,0.85,temp));
  vec3 dry = mix(desert, desertR, smoothstep(0.35,0.65,fbm3(d*6.0+vec3(4.0))));
  vec3 c = mix(dry, veg, wet);
  c = mix(tundra, c, smoothstep(0.18,0.42,temp));
  c = mix(c, rock, smoothstep(0.66,1.00,e)*0.85);
  c = mix(c, snow, smoothstep(0.80,1.00,e + (0.28-temp)*0.9));
  c = mix(c, snow, smoothstep(0.86,0.94,abs(d.y)));
  float detail = 0.80 + 0.40*fbm(d*55.0);
  float detail2 = 0.90 + 0.20*vn(d*180.0);
  return c*detail*detail2;
}
void main(){
  if (vUv.x < uX0 || vUv.x >= uX1) discard;
  vec3 d = dirFromUv(vUv);
  float h = landH(d);
  float lat = abs(d.y);
  float temp = 1.0 - pow(lat, 1.35)*1.20 + (fbm3(d*4.0 + vec3(2.0)) - 0.5)*0.28 - max(h - SEA - 0.10, 0.0)*1.1;
  float moist = fbm(d*3.0 + vec3(9.0)) * 1.30 - 0.04 + 0.25*(1.0 - smoothstep(0.0, 0.5, lat)) - 0.28*smoothstep(0.18,0.34,lat)*(1.0-smoothstep(0.34,0.5,lat));
  float e = clamp((h - SEA)/0.125, 0.0, 1.0);
  bool isLand = h > SEA;
  float ice = smoothstep(0.10, 0.03, temp);

  if (uMode < 0.5) {            // ---- day colour
    vec3 col;
    if (isLand) {
      col = landColor(d, h, temp, moist, e);
    } else {
      float dep = clamp((SEA - h)*3.6, 0.0, 1.0);
      col = mix(vec3(0.040,0.380,0.500), vec3(0.008,0.060,0.190), pow(dep, 0.5));
      col *= 0.92 + 0.16*fbm3(d*30.0);
      col = mix(col, vec3(0.88,0.93,0.97), ice);
    }
    col = mix(col, vec3(0.93,0.95,0.98), smoothstep(0.95, 0.985, lat));
    gl_FragColor = vec4(pow(clamp(col,0.0,1.0), vec3(1.0/2.2)), 1.0);
  } else if (uMode < 1.5) {     // ---- night lights
    vec3 col = vec3(0.0);
    if (isLand) {
      float pop = smoothstep(0.46, 0.74, fbm(d*7.0 + vec3(31.0)));
      pop *= smoothstep(0.12, 0.38, temp) * (1.0 - smoothstep(0.45, 0.75, e));
      pop *= 1.0 + 0.9*smoothstep(0.10, 0.0, e);
      float fine = pow(fbm(d*62.0 + vec3(5.0)), 2.6) * 3.6 + pow(vn(d*240.0), 5.0) * 1.2;
      float l = pop * fine;
      col = vec3(1.0, 0.76, 0.40) * l;
      col += vec3(1.0, 0.90, 0.70) * pow(l, 3.0) * 0.6;
    }
    gl_FragColor = vec4(pow(clamp(col, 0.0, 1.0), vec3(1.0/2.2)), 1.0);
  } else if (uMode < 2.5) {     // ---- ocean mask (specular)
    float oc = isLand ? 0.0 : (1.0 - ice);
    gl_FragColor = vec4(vec3(oc), 1.0);
  } else {                      // ---- clouds
    vec3 p = d*2.1;

        /* ---------- polyhedron : 24 vertices, 26 faces, 48 edges ---------- */
        function polyVertices() {
            const vs = [];
            for (const a of [-1, 1]) for (const b of [-1, 1]) for (const c of [-PH, PH]) vs.push(new THREE.Vector3(a, b, c), new THREE.Vector3(a, c, b), new THREE.Vector3(c, a, b));
            return vs;
        }
        const secOfY = y => y > .5 ? 'top' : y < -.5 ? 'bot' : 'mid';

        function polyFaces() {
            const V3 = THREE.Vector3, vs = polyVertices(), faces = [];
            for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) for (let k = -1; k <= 1; k++) {
                if (!i && !j && !k) continue;
                const n = new V3(i, j, k).normalize(), top = Math.max(...vs.map(v => v.dot(n))), fv = vs.filter(v => v.dot(n) > top - 1e-4), ctr = new V3();
                fv.forEach(v => ctr.add(v)); ctr.multiplyScalar(1 / fv.length);
                const u = (Math.abs(n.y) > .99 ? new V3(1, 0, 0) : new V3().crossVectors(new V3(0, 1, 0), n)).normalize(), w = new V3().crossVectors(n, u);
                const pts = fv.map(v => { const d = v.clone().sub(ctr); return new THREE.Vector2(d.dot(u), d.dot(w)); }).sort((a, b) => Math.atan2(a.y, a.x) - Math.atan2(b.y, b.x));
                let ap = 1e9; for (let q = 0; q < pts.length; q++) { const p0 = pts[q], p1 = pts[(q + 1) % pts.length]; ap = Math.min(ap, (p0.x * p1.y - p0.y * p1.x) / p0.distanceTo(p1)); }
                faces.push({ n, ctr, u, w, pts, apo: ap, tri: pts.length === 3, deck: Math.abs(n.y) > .99, sec: secOfY(ctr.y), idx: faces.length });
            }

        const inset = (pts, apo, d) => pts.map(p => p.clone().multiplyScalar((apo - d) / apo));

        function addPart(group, mesh, part, keep) {

                const pp = pg.attributes.position, uv = pg.attributes.uv; let mnx = 1e9, mny = 1e9;
                f.pts.forEach(p => { mnx = Math.min(mnx, p.x); mny = Math.min(mny, p.y); });
                for (let q = 0; q < pp.count; q++) uv.setXY(q, (pp.getX(q) - mnx) / 2, (pp.getY(q) - mny) / 2);

        /* ===================== ARYABHATA : EXTERIOR FITTINGS + INTERIOR ===================== */
        const CY = (a, b, h, s) => new THREE.CylinderGeometry(a, b, h, s || 24);
