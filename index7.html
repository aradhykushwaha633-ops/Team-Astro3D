<html>

<head>
  <meta charset=utf8>
  <meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
  <style>
    :root {
      color-scheme: light;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    body {
      margin: 0;
      padding: 0;
      font: 14px -apple-system, BlinkMacSystemFont, sans-serif;
      background: #fff;
      color: #000
    }

    img {
      max-width: 100%
    }

    [hidden]:not([hidden=until-found i]) {
      display: none !important
    }
  </style>
<script src="script2.js"></script>
<script src="script1.js"></script>
<style>
/* ===== Go Back button ===== */
.back-btn{--back-accent:#ffb35c;position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:max(14px,env(safe-area-inset-left,0px));z-index:1000;display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 15px 0 11px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(8,14,26,.55);-webkit-backdrop-filter:blur(12px) saturate(140%);backdrop-filter:blur(12px) saturate(140%);color:#eef2fb;font:600 13px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.04em;text-decoration:none;white-space:nowrap;box-shadow:0 4px 18px rgba(0,0,0,.4);-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:background .2s,border-color .2s,color .2s,transform .2s}
.back-btn svg{width:16px;height:16px;flex:none;transition:transform .2s}
.back-btn:hover{background:rgba(8,14,26,.82);border-color:var(--back-accent);color:#fff}
.back-btn:hover svg{transform:translateX(-3px)}
.back-btn:focus-visible{outline:2px solid var(--back-accent);outline-offset:3px}
.back-btn:active{transform:scale(.96)}
@media (prefers-reduced-motion:reduce){.back-btn,.back-btn svg{transition:none}}
</style>
</head>

<body>
<a class="back-btn" href="index.html" aria-label="Go back to the home page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg><span>Go Back</span></a>
  <title>Spacewalk Rescue</title>
  <meta name="claude:viewport-fit-sides" content="cover">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;600&display=swap">
  <style>
    /* Layout: full-bleed WebGL stage; title and buttons top, live stats bottom, a centered glass card for lessons and quizzes. Single dark look by choice. */
    :root {
      --bg: #02030a;
      --fg: #eef1ff;
      --dim: #8d97c4;
      --line: rgba(160, 172, 220, 0.3);
      --accent: #ffb35c;
      --good: #5fe0a8;
      --bad: #ff6a5c;
      --card: rgba(5, 8, 22, 0.86);
      --display: 'Unbounded', 'Arial Black', system-ui, sans-serif;
      --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
      color-scheme: dark;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      box-sizing: border-box;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--mono);
      overflow: hidden;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
    }

    #stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      cursor: crosshair;
      -webkit-user-select: none;
      user-select: none;
    }

    .vig {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at 50% 50%, rgba(0, 0, 0, 0) 58%, rgba(0, 0, 6, 0.55) 100%);
    }

    .hud {
      position: fixed;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px 16px;
      flex-wrap: wrap;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--dim);
      pointer-events: none;
    }

    .hud.top {
      top: env(safe-area-inset-top, 0px);
      padding-top: 18px;
    }

    .hud.top > div:first-child {
      margin-top: 46px;
    }

    .hud.bottom {
      bottom: env(safe-area-inset-bottom, 0px);
      padding-bottom: 18px;
      align-items: flex-end;
    }

    h1 {
      margin: 0 0 6px;
      font-family: var(--display);
      font-weight: 600;
      font-size: clamp(18px, 3.6vw, 28px);
      letter-spacing: 0.03em;
      text-transform: none;
      color: var(--fg);
      text-wrap: balance;
    }

    .btns {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .stats {
      display: flex;
      gap: 10px 22px;
      flex-wrap: wrap;
      align-items: flex-end;
      margin: 0;
      font-variant-numeric: tabular-nums;
    }

    .stats div {
      min-width: 0;
    }

    .stats dt {
      font-size: 10px;
      margin-bottom: 5px;
    }

    .stats dd {
      margin: 0;
      color: var(--fg);
      font-size: 14px;
      letter-spacing: 0.06em;
    }

    .stats dd i {
      font-style: normal;
      color: var(--dim);
      font-size: 10px;
      margin-left: 3px;
    }

    .bar {
      width: 150px;
      height: 8px;
      border: 1px solid var(--line);
      border-radius: 99px;
      overflow: hidden;
      margin-top: 3px;
    }

    .bar i {
      display: block;
      height: 100%;
      width: 100%;
      background: var(--good);
      transition: background 0.3s;
    }

    .bar.low i {
      background: var(--bad);
    }

    #how {
      margin-top: 10px;
      max-width: 46ch;
      line-height: 1.6;
      text-transform: none;
      letter-spacing: 0.04em;
    }

    #load {
      margin-top: 6px;
      transition: opacity 0.8s ease;
    }

    #load.gone {
      opacity: 0;
    }

    #toast {
      position: fixed;
      left: 50%;
      top: calc(env(safe-area-inset-top, 0px) + 142px);
      transform: translateX(-50%);
      max-width: min(92vw, 520px);
      padding: 10px 16px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--card);
      color: var(--fg);
      font-size: 13px;
      line-height: 1.5;
      text-align: center;
      opacity: 0;
      transition: opacity 0.35s ease;
      pointer-events: none;
    }

    #toast.on {
      opacity: 1;
    }

    button {
      pointer-events: auto;
      font: inherit;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--fg);
      background: rgba(2, 3, 10, 0.5);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 16px;
      cursor: pointer;
    }

    button:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--accent);
    }

    button[aria-pressed="true"] {
      border-color: var(--accent);
      color: var(--accent);
    }

    button:disabled {
      opacity: 0.45;
      cursor: default;
    }

    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .panel {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px));
      background: rgba(1, 2, 8, 0.45);
      overflow-y: auto;
    }

    .card {
      width: 100%;
      max-width: 460px;
      box-sizing: border-box;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 24px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      font-size: 14px;
      line-height: 1.65;
      letter-spacing: 0.02em;
    }

    .card h2 {
      margin: 6px 0 12px;
      font-family: var(--display);
      font-weight: 600;
      font-size: 22px;
      line-height: 1.25;
      text-wrap: balance;
    }

    .card p {
      margin: 0 0 12px;
    }

    .card .kicker {
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--dim);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card .how {
      color: var(--dim);
      font-size: 13px;
    }

    .card .primary {
      background: var(--accent);
      color: #1a1205;
      border-color: var(--accent);
      font-weight: 500;
      margin-top: 6px;
    }

    .card .primary:hover:not(:disabled) {
      color: #1a1205;
      filter: brightness(1.08);
    }

    .opts {
      display: grid;
      gap: 8px;
      margin: 14px 0;
    }

    .opts button {
      text-align: left;
      text-transform: none;
      letter-spacing: 0.02em;
      border-radius: 10px;
      padding: 10px 14px;
      line-height: 1.5;
    }

    .opts button.right {
      border-color: var(--good);
      color: var(--good);
      opacity: 1;
    }

    .opts button.wrong {
      border-color: var(--bad);
      color: var(--bad);
      opacity: 0.8;
    }

    .ok {
      color: var(--good);
    }

    .no {
      color: var(--bad);
    }

    .flag {
      display: inline-block;
      width: 26px;
      height: 18px;
      border-radius: 2px;
      background: linear-gradient(#ff9933 0 33.3%, #fff 33.3% 66.6%, #138808 66.6% 100%);
      position: relative;
      flex: none;
    }

    .flag::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 6px;
      height: 6px;
      margin: -3px 0 0 -3px;
      border: 1px solid #000080;
      border-radius: 50%;
      box-sizing: border-box;
    }

    .stars {
      letter-spacing: 0.2em;
      color: var(--accent);
    }

    #msg {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      font-size: 14px;
      line-height: 1.6;
      color: var(--dim);
    }
  </style>

  <canvas id="stage" tabindex="0" role="img"
    aria-label="Spacewalk Rescue: a 3D astronaut with an Indian flag on his chest floats in zero gravity above Earth. Collect the drifting tools before oxygen runs out. Hold the pointer or use the arrow keys."></canvas>
  <div class="vig"></div>

  <header class="hud top">
    <div>
      <h1>Spacewalk Rescue</h1>
      <div id="lvl">Recover the toolkit</div>

    <div class="btns">
      <button id="stab" type="button" aria-pressed="false" hidden>Stabilize: off</button>

  <div id="panel" class="panel" hidden>
    <div id="card" class="card"></div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
  <script>
    (function () {
      'use strict';
      var stage = document.getElementById('stage');
      var msg = document.getElementById('msg');
      function fail() { msg.style.display = 'flex'; stage.style.display = 'none'; }

      var THREE = window.THREE;
      var renderer;

        renderer = new THREE.WebGLRenderer({ canvas: stage, antialias: true, powerPreference: 'high-performance' });

      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

      /* ---------- noise (3D value noise, seamless on a sphere) ---------- */
      function hash(i, j, k) {

        var a = hash(xi, yi, zi), b = hash(xi + 1, yi, zi), c = hash(xi, yi + 1, zi), d = hash(xi + 1, yi + 1, zi);
        var e = hash(xi, yi, zi + 1), f = hash(xi + 1, yi, zi + 1), g = hash(xi, yi + 1, zi + 1), h = hash(xi + 1, yi + 1, zi + 1);
        var x1 = a + (b - a) * fx, x2 = c + (d - c) * fx, x3 = e + (f - e) * fx, x4 = g + (h - g) * fx;

        var s = 0, a = 0.5, n = 0;

      function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
      function smooth(a, b, v) { var t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }

      }

        while (j.row < j.h && performance.now() - t0 < 5) {
          var y = j.row;

      }
      function dirOf(u, v, out) {
        var lon = (u * 2 - 1) * Math.PI, lat = (0.5 - v) * Math.PI, cl = Math.cos(lat);
        out[0] = cl * Math.cos(lon); out[1] = Math.sin(lat); out[2] = cl * Math.sin(lon); out[3] = lat;
      }

      /* ---------- image-based light: dark sky, hot sun, bright Earth below ---------- */
      var pm = new THREE.PMREMGenerator(renderer);
      var es = new THREE.Scene();
      es.add(new THREE.Mesh(new THREE.SphereGeometry(50, 32, 16), new THREE.MeshBasicMaterial({ color: 0x010206, side: THREE.BackSide })));
      var envSun = new THREE.Mesh(new THREE.SphereGeometry(4, 16, 8), new THREE.MeshBasicMaterial({ color: new THREE.Color(1, 0.97, 0.9).multiplyScalar(90) }));
      envSun.position.copy(sunDir).multiplyScalar(40); es.add(envSun);
      var envEarth = new THREE.Mesh(new THREE.SphereGeometry(60, 32, 16), new THREE.MeshBasicMaterial({ color: new THREE.Color(0.42, 0.62, 1.0).multiplyScalar(1.6) }));
      envEarth.position.set(0, -64, -14); es.add(envEarth);
      scene.environment = pm.fromScene(es, 0.02).texture;
      es.traverse(function (o) { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); });
      pm.dispose();

      /* ---------- lights ---------- */
      var sun = new THREE.DirectionalLight(0xfff4e6, 2.3);
      sun.position.copy(sunDir).multiplyScalar(14);
      sun.castShadow = true;
      sun.shadow.mapSize.set(2048, 2048);
      sun.shadow.camera.left = -3.4; sun.shadow.camera.right = 3.4; sun.shadow.camera.top = 3.4; sun.shadow.camera.bottom = -3.4;
      sun.shadow.camera.near = 4; sun.shadow.camera.far = 30;
      sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;

      earthshine.position.set(0.2, -1, 0.4);
      scene.add(earthshine);

      skyTex.colorSpace = THREE.SRGBColorSpace;
      var skyMat = new THREE.MeshBasicMaterial({ map: skyTex, side: THREE.BackSide, depthWrite: false, toneMapped: false });
      var sky = new THREE.Mesh(new THREE.SphereGeometry(600, 64, 32), skyMat);
      sky.rotation.y = 1.1;
      scene.add(sky);
      var galN = new THREE.Vector3(0.28, 0.9, 0.33).normalize();
      addJob(1024, 512, function (u, v, o) {
        dirOf(u, v, o);
        var x = o[0], y = o[1], z = o[2];

        var band = Math.exp(-(coord * coord) / (2 * 0.17 * 0.17));
        var dens = fbm(x * 3 + 5, y * 3, z * 3, 5);
        var dust = fbm(x * 6.5 + 9, y * 6.5, z * 6.5, 4);
        var core = Math.max(0, x * 0.5 + z * 0.8 + y * 0.1); core = Math.pow(core, 6);
        var I = band * (0.28 + dens * 1.05 + core * 1.1);
        var lane = smooth(0.46, 0.64, dust) * band * 0.75;
        I = Math.max(0, I - lane * 0.7);
        var fine = fbm(x * 40, y * 40, z * 40, 2);
        I *= 0.7 + fine * 0.6;
        var r = 0.006 + 0.42 * I + 0.38 * I * I;
        var g = 0.008 + 0.45 * I + 0.22 * I * I;
        var b = 0.016 + 0.62 * I + 0.1 * I * I;
        o[0] = clamp(r, 0, 1) * 255; o[1] = clamp(g, 0, 1) * 255; o[2] = clamp(b, 0, 1) * 255; o[3] = 255;
      }, function (c) { var t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; skyMat.map = t; skyMat.needsUpdate = true; skyTex.dispose(); });

      var pointVS = 'attribute float size; attribute vec3 color; varying vec3 vC; uniform float pr; void main(){ vC=color; vec4 mv=modelViewMatrix*vec4(position,1.0); gl_PointSize=size*pr; gl_Position=projectionMatrix*mv; }';
      (function stars() {
        var N = 9000, pos = new Float32Array(N * 3), col = new Float32Array(N * 3), size = new Float32Array(N);
        var i = 0, tries = 0;
        while (i < N && tries < N * 20) {
          tries++;
          var a = Math.random() * 6.2832, zz = Math.random() * 2 - 1, rr = Math.sqrt(1 - zz * zz);
          var dx = rr * Math.cos(a), dy = zz, dz = rr * Math.sin(a);
          var c = dx * galN.x + dy * galN.y + dz * galN.z;
          var p = 0.18 + 0.82 * Math.exp(-(c * c) / (2 * 0.2 * 0.2));
          if (Math.random() > p) continue;
          pos[i * 3] = dx * 500; pos[i * 3 + 1] = dy * 500; pos[i * 3 + 2] = dz * 500;
          var m = Math.pow(Math.random(), 4);
          var t = Math.random();
          var br = 0.35 + m * 0.9;
          var cr = t < 0.25 ? 0.75 : t > 0.8 ? 1.0 : 0.95;
          var cg = t < 0.25 ? 0.85 : t > 0.8 ? 0.82 : 0.96;
          var cb = t < 0.25 ? 1.0 : t > 0.8 ? 0.65 : 1.0;
          col[i * 3] = cr * br; col[i * 3 + 1] = cg * br; col[i * 3 + 2] = cb * br;
          size[i] = 1.1 + m * 3.6;
          i++;

      function emitThrust(dx, dy) {
        for (var i = 0; i < 2; i++) {
          emit(S.pos.x - dx * 0.5 * ASTRO_SCALE + (Math.random() - 0.5) * 0.16, S.pos.y - dy * 0.5 * ASTRO_SCALE + (Math.random() - 0.5) * 0.16, S.pos.z + (Math.random() - 0.5) * 0.16,
            -dx * (1.4 + Math.random() * 0.8) + S.vel.x * 0.5, -dy * (1.4 + Math.random() * 0.8) + S.vel.y * 0.5, (Math.random() - 0.5) * 0.4);
        }
      }
      function emitStabilize() {
        var o = tv.set((Math.random() < 0.5 ? -1 : 1) * 0.36, (Math.random() < 0.5 ? -1 : 1) * 0.3, -0.3 - Math.random() * 0.1).multiplyScalar(ASTRO_SCALE).applyQuaternion(S.q);
        var out = tv2.copy(o).normalize();
        emit(S.pos.x + o.x, S.pos.y + o.y, S.pos.z + o.z, out.x * 1.3 + S.vel.x * 0.5, out.y * 1.3 + S.vel.y * 0.5, out.z * 1.3);
      }
      function frame(now) {
        var dt = Math.min(0.05, (now - last) / 1000); last = now;
        T += dt;
        runJobs();
        cooldown = Math.max(0, cooldown - dt); boostCd -= dt; magT -= dt; magCd -= dt;
        var playing = state === 'play';
        var thrustAmt = computeThrust();
        stabOn = (stabilize || keys.sp) && L.stab && playing;
        var steps = Math.max(1, Math.ceil(dt / 0.008));
        for (var s = 0; s < steps; s++) physicsStep(dt / steps);

        if (playing || state === 'done') updateTools(dt, T);
        if (playing) updateDebris(dt);
        if (playing) {
          oxygen -= L.drain * dt;
          if (thrustAmt > 0) { oxygen -= 5 * dt * thrustAmt; emitThrust(thrustVec.x, thrustVec.y); }
          if (stabOn && (S.vel.length() > 0.05 || S.L.length() > 0.02)) { oxygen -= 7 * dt; if (Math.random() < 0.5) emitStabilize(); }
          for (var i = 0; i < tools.length; i++) {
            var o = tools[i];
            if (!o.got && o.pos.distanceTo(S.pos) < 0.4) { collect(o); if (state !== 'play') break; }
          }
          if (state === 'play' && oxygen <= 0) { oxygen = 0; showFail(); }
        }
        if (state === 'done') { doneTimer -= dt; if (doneTimer <= 0) showQuiz(); }
        updatePuffs(dt);

        astro.position.copy(S.pos);
        astro.quaternion.copy(S.q);
        pose(T, dt);

        camera.position.set(0, 0, camDist);
        camera.lookAt(0, 0, 0);
        earthGroup.rotation.y += dt * 0.004;
        clouds.rotation.y += dt * 0.003;
        hudT += dt; if (hudT > 0.08) { hudT = 0; updateHud(); }
        renderer.render(scene, camera);
        requestAnimationFrame(frame);
      }
      prepareLevel(0);
      showMenu();
      requestAnimationFrame(frame);
    })();
  </script>
