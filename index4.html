<!DOCTYPE html>

  <style>

<body>
  <div id="mom"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    /* ===== Scoped styles (.mom-*), injected once ===== */
    const MOM_CSS = `
.mom{position:relative;width:100%;height:100%;min-height:480px;overflow:hidden;background:#02030a;font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#e8ecf7;user-select:none;-webkit-tap-highlight-color:transparent}

.mom canvas:active{cursor:grabbing}
.mom-title{position:absolute;top:16px;left:18px;pointer-events:none}
.mom-title b{display:block;font-size:18px;letter-spacing:.28em;font-weight:600}
.mom-title span{font-size:11px;letter-spacing:.14em;color:#ff9d5c;text-transform:uppercase}
.mom-hint{position:absolute;top:18px;right:18px;font-size:10.5px;letter-spacing:.1em;color:#8d98b5;pointer-events:none;text-align:right}
.mom-card{position:absolute;left:16px;bottom:118px;width:min(360px,calc(100% - 32px));box-sizing:border-box;padding:16px 18px 14px;border-radius:16px;background:rgba(14,20,38,.55);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%);box-shadow:0 12px 40px rgba(0,0,0,.45);opacity:0;transform:translateY(12px);pointer-events:none;transition:.35s cubic-bezier(.2,.8,.2,1)}
.mom-card.on{opacity:1;transform:none;pointer-events:auto}
.mom-card i{font-style:normal;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#4fd8ff}
.mom-card h3{margin:2px 30px 8px 0;font-size:17px;font-weight:600}
.mom-x{position:absolute;top:10px;right:12px;width:28px;height:28px;border:0;border-radius:50%;background:rgba(255,255,255,.1);color:#fff;font-size:18px;line-height:1;cursor:pointer}
.mom-x:hover{background:rgba(255,255,255,.24)}
.mom-txt{margin:0;min-height:84px;color:#cfd6ea;font-size:13px}
.mom-txt.ty::after{content:"▍";color:#4fd8ff;animation:mom-b .7s steps(1) infinite}
@keyframes mom-b{50%{opacity:0}}
.mom-sp{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:10px 0 0;padding-top:10px;border-top:1px solid rgba(255,255,255,.1);font-size:12px;opacity:0;transition:opacity .5s}
.mom-sp.on{opacity:1}
.mom-sp dt{color:#8d98b5}.mom-sp dd{margin:0;color:#fff}
.mom-bar{position:absolute;left:0;right:0;bottom:0;padding:22px 12px 14px;display:flex;gap:16px;overflow-x:auto;scrollbar-width:none;background:linear-gradient(transparent,rgba(2,3,10,.88))}
.mom-bar::-webkit-scrollbar{display:none}
.mom-g{flex:none}
.mom-g small{display:block;margin:0 4px 5px;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#7f8aa8}
.mom-g div{display:flex;gap:6px}
.mom-chip{padding:7px 12px;border-radius:99px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:#dfe5f5;font:inherit;font-size:12px;cursor:pointer;white-space:nowrap;transition:.2s}
.mom-chip:hover{background:rgba(255,255,255,.15)}
.mom-chip.on{background:#4fd8ff;border-color:#4fd8ff;color:#04101a;font-weight:600;box-shadow:0 0 16px rgba(79,216,255,.5)}
`;

    /* ===== Procedural canvas textures ===== */
    const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')] };
    function toTex(c, rx = 1, ry = 1) { const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 8; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); return t }

    /* Crinkled multi-layer-insulation foil: base colour + random light/dark facets + taped seam */
    function foilTex(base, hi, lo) {
      const [c, g] = mk(256, 256); g.fillStyle = base; g.fillRect(0, 0, 256, 256);
      for (let i = 0; i < 460; i++) {
        const x = Math.random() * 256, y = Math.random() * 256, r = 6 + Math.random() * 26;
        g.beginPath();
        for (let k = 0; k < 4; k++) { const a = Math.random() * 6.28, q = r * (.5 + Math.random() * .6); g.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q) }
        g.closePath(); g.globalAlpha = .07 + Math.random() * .13; g.fillStyle = Math.random() < .5 ? hi : lo; g.fill();
      }
      g.globalAlpha = 1; g.strokeStyle = 'rgba(50,34,8,.4)'; g.lineWidth = 3; g.strokeRect(1, 1, 254, 254);
      return toTex(c, 2, 2);
    }
    /* Photovoltaic cell grid: blue cells, fine bus-bar lines, gap grid */
    function cellTex() {
      const [c, g] = mk(512, 256), cols = 24, rows = 12, cw = 512 / cols, ch = 256 / rows;
      g.fillStyle = '#8a97ad'; g.fillRect(0, 0, 512, 256);
      for (let i = 0; i < cols; i++)for (let j = 0; j < rows; j++) {
        const x = i * cw, y = j * ch, gr = g.createLinearGradient(x, y, x + cw, y + ch);
        gr.addColorStop(0, '#2349b5'); gr.addColorStop(1, '#0c1f66'); g.fillStyle = gr; g.fillRect(x + 1.5, y + 1.5, cw - 3, ch - 3);
        g.strokeStyle = 'rgba(170,200,255,.4)'; g.lineWidth = .7;
        for (let k = 1; k < 4; k++) { g.beginPath(); g.moveTo(x + 1.5, y + 1.5 + k * (ch - 3) / 4); g.lineTo(x + cw - 1.5, y + 1.5 + k * (ch - 3) / 4); g.stroke() }
      }
      return toTex(c);
    }
    /* Instrument casing / thermal-control patch: checker + seams + screws */
    function chkTex(a, b, n = 8) {
      const [c, g] = mk(128, 128), s = 128 / n;
      for (let i = 0; i < n; i++)for (let j = 0; j < n; j++) { g.fillStyle = (i + j) % 2 ? a : b; g.fillRect(i * s, j * s, s, s) }
      g.strokeStyle = 'rgba(0,0,0,.45)'; g.lineWidth = 2; g.strokeRect(1, 1, 126, 126); g.fillStyle = '#0b0c0f';
      [[8, 8], [120, 8], [8, 120], [120, 120]].forEach(p => { g.beginPath(); g.arc(p[0], p[1], 2.5, 0, 6.28); g.fill() });
      return toTex(c, 3, 3);
    }

    /* Procedural Mars Planet texture */
    function marsTex() {
      const [c, g] = mk(512, 256);
      g.fillStyle = '#c1440e'; g.fillRect(0, 0, 512, 256);
      for (let i = 0; i < 500; i++) {
        const x = Math.random() * 512, y = Math.random() * 256, r = 10 + Math.random() * 35;
        g.beginPath(); g.arc(x, y, r, 0, 6.28);
        g.fillStyle = Math.random() < .5 ? '#8b2500' : '#a73305';
        g.globalAlpha = .15 + Math.random() * .25;
        g.fill();
      }
      g.globalAlpha = 0.85; g.fillStyle = '#ffffff';
      g.beginPath(); g.ellipse(256, 0, 160, 30, 0, 0, 6.28); g.fill();
      g.beginPath(); g.ellipse(256, 256, 120, 22, 0, 0, 6.28); g.fill();
      return toTex(c, 1, 1);
    }

    /* ===== Part database: id, group, chip, title, camera target, distance, azimuth, polar, text, specs ===== */
    const MOM_PARTS = [
      ['bus', 'Spacecraft Bus', 'Central Bus', 'I-1K Spacecraft Bus', [0, 0, 0], 8.5, .8, 1.2, 'A 1.5 m cuboid of carbon-fibre and aluminium-honeycomb panels around a central cylinder, wrapped in gold and silver multi-layer insulation that keeps the electronics within survivable temperatures.', [['Launch mass', '1,337 kg'], ['Propellant', '852 kg'], ['Orbit', '421 × 76,993 km'], ['Launched', '5 Nov 2013, PSLV-C25']]],
      ['tank', 'Spacecraft Bus', 'Propellant Tank', 'Propellant Tank & Central Cylinder', [0, 1.3, 0], 4.2, .6, 1, 'The domed tank assembly crowns the central cylinder. It stores the hypergolic bipropellant that fed the main engine and attitude thrusters through a ten-month cruise and eight years in Mars orbit.', [['Propellants', 'MMH + MON-3'], ['Loaded', '852 kg'], ['Role', 'Cruise, capture, orbit trim']]],
      ['array', 'Solar Arrays', 'Tri-Panel Array', 'Tri-Panel Solar Array', [-4.8, 0, 0], 11, .45, .95, 'Three hinged panels of high-efficiency cells unfurled after launch to power the craft. A lithium-ion battery carried it through eclipses behind Mars.', [['Panels', '3 × 1.4 × 1.8 m'], ['Area', '7.56 m²'], ['Output', '~840 W at Mars'], ['Battery', '36 Ah Li-ion']]],
      ['lam', 'Propulsion', 'LAM Engine', '440 N Liquid Apogee Motor', [0, -1.5, 0], 4.2, .7, 2.05, 'The main engine on the underside raised the orbit around Earth, sent the craft toward Mars, and braked it into Mars orbit after about 300 days idle.', [['Thrust', '440 N'], ['Propellants', 'MMH + MON-3'], ['Capture burn', '24 Sep 2014, ~1,389 s']]],
      ['thr', 'Propulsion', 'Thruster Quads', '22 N Attitude Thrusters', [0, -1.1, 0], 6, .8, 1.95, 'Eight small thrusters in four corner pods steer the craft, unload momentum from its reaction wheels and flew the small trajectory-correction burns.', [['Count', '8 × 22 N'], ['Fuel', 'MMH + MON-3'], ['Jobs', 'Attitude, TCMs, wheel unloading']]],
      ['mcc', 'Scientific Payloads', 'MCC', 'Mars Color Camera', [.45, .55, 1.2], 3.2, .2, 1.35, 'A tri-colour camera that images surface features, clouds and dust storms, and supplies context for the other four instruments.', [['Resolution', '~19 m at periapsis'], ['Spectral', 'Tri-colour'], ['Role', 'Context imaging']]],
      ['tis', 'Scientific Payloads', 'TIS', 'Thermal Infrared Imaging Spectrometer', [-.85, 1.25, .65], 3, -.6, 1, 'Measures heat radiated by the surface to map temperature and mineral composition, by day or night.', [['Band', '7–13 µm'], ['Resolution', '~258 m at periapsis'], ['Science', 'Surface mineralogy']]],
      ['msm', 'Scientific Payloads', 'MSM', 'Methane Sensor for Mars', [.85, 1.2, .65], 3, .8, 1, 'A Fabry–Pérot-based sensor built to detect methane in Mars’s atmosphere, a gas that could point to geological or biological activity. It also maps surface albedo.', [['Target', 'CH₄, ppb level'], ['Type', 'Fabry–Pérot sensor'], ['Also', 'Surface albedo']]],
      ['menca', 'Scientific Payloads', 'MENCA', 'Mars Exospheric Neutral Composition Analyser', [.85, 1.3, -.7], 3, 2.3, 1, 'A quadrupole mass spectrometer that samples neutral gas in Mars’s thin outer atmosphere, tracing which species are present and how they escape to space.', [['Type', 'Quadrupole mass spec'], ['Range', '1–300 amu'], ['Target', 'Exospheric neutrals']]],
      ['lap', 'Scientific Payloads', 'LAP', 'Lyman Alpha Photometer', [-.85, 1.25, -.85], 3, -2.3, 1, 'Measures Lyman-alpha emission from hydrogen and deuterium high in the atmosphere. The D/H ratio reveals how much water Mars has lost to space.', [['Wavelength', '121.6 nm'], ['Measures', 'Deuterium / hydrogen'], ['Science', 'Water-loss history']]],
      ['hga', 'Communication', 'HGA Dish', 'High-Gain Antenna', [2.85, .35, 0], 6.5, 1.4, 1.25, 'The 2.2 m reflector is the primary Earth link for telemetry and science data across hundreds of millions of kilometres. One-way signal delay reached about 20 minutes.', [['Diameter', '2.2 m'], ['Band', 'S-band'], ['Ground', 'Indian Deep Space Network']]],
      ['ant', 'Communication', 'LGA / MGA', 'Low & Medium-Gain Antennas', [-1.1, 1.4, .9], 4, -.3, 1.1, 'The omnidirectional low-gain and the medium-gain antennas keep a command link alive during early orbits, manoeuvres and safe-mode, when the HGA cannot point at Earth.', [['LGA', 'Omnidirectional'], ['MGA', 'Medium gain, S-band'], ['Role', 'Backup / contingency link']]]
    ];

    /* ===== Factory: MarsOrbiterMission(rootElement, options) → {select, reset, destroy, ...} ===== */
    function MarsOrbiterMission(root, opts = {}) {
      opts = Object.assign({ autoRotate: true }, opts);
      const T = THREE, PI = Math.PI, V = (x, y, z) => new T.Vector3(x, y, z), wrap = a => Math.atan2(Math.sin(a), Math.cos(a)), clamp = (v, a, b) => Math.max(a, Math.min(b, v));
      if (!document.getElementById('mom-css')) { const s = document.createElement('style'); s.id = 'mom-css'; s.textContent = MOM_CSS; document.head.appendChild(s) }
      root.classList.add('mom');
      root.innerHTML = '<canvas></canvas><div class="mom-title"><b>MANGALYAAN</b><span>Mars Orbiter Mission · ISRO</span></div><div class="mom-hint">DRAG TO ORBIT · SCROLL TO ZOOM<br>TAP A PART TO STUDY IT</div><div class="mom-card"><button class="mom-x" aria-label="Close">×</button><i></i><h3></h3><p class="mom-txt"></p><dl class="mom-sp"></dl></div><div class="mom-bar"></div>';
      const $ = s => root.querySelector(s), canvas = $('canvas'), card = $('.mom-card'), txt = $('.mom-txt'), sp = $('.mom-sp'), bar = $('.mom-bar');

      /* --- Renderer, scene, camera --- */
      const renderer = new T.WebGLRenderer({ canvas, antialias: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
      renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.PCFSoftShadowMap;
      renderer.outputEncoding = T.sRGBEncoding; renderer.toneMapping = T.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
      const scene = new T.Scene(); scene.background = new T.Color(0x02030a);
      const camera = new T.PerspectiveCamera(40, 1, .1, 600);

      /* Procedural environment map so metals and MLI have something to reflect */
      {
        const [c, g] = mk(256, 128), gr = g.createLinearGradient(0, 0, 0, 128);
        gr.addColorStop(0, '#26335c'); gr.addColorStop(.5, '#06080f'); gr.addColorStop(1, '#3a2316'); g.fillStyle = gr; g.fillRect(0, 0, 256, 128);
        const sg = g.createRadialGradient(150, 38, 0, 150, 38, 48); sg.addColorStop(0, '#fff'); sg.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = sg; g.fillRect(0, 0, 256, 128);
        const et = new T.CanvasTexture(c); et.mapping = T.EquirectangularReflectionMapping; et.encoding = T.sRGBEncoding;
        const pm = new T.PMREMGenerator(renderer); scene.environment = pm.fromEquirectangular(et).texture; pm.dispose()
      }

      /* --- Lighting: sun with soft shadows, faint cold fill --- */
      scene.add(new T.AmbientLight(0x1c2748, .7));
      const sun = new T.DirectionalLight(0xfff0dc, 2.4); sun.position.set(10, 9, 7); sun.castShadow = true;
      sun.shadow.mapSize.set(1024, 1024); Object.assign(sun.shadow.camera, { left: -11, right: 11, top: 11, bottom: -11, near: 1, far: 40 }); sun.shadow.bias = -.0006; sun.shadow.radius = 3;
      scene.add(sun); const fill = new T.DirectionalLight(0x4a6cff, .4); fill.position.set(-8, -3, -6); scene.add(fill);

      /* --- Starfield: two layers (distant fine / near bright) with tinted colours --- */
      function stars(n, r0, r1, size) {
        const p = new Float32Array(n * 3), c = new Float32Array(n * 3);
        for (let i = 0; i < n; i++) {
          const r = r0 + Math.random() * (r1 - r0), u = Math.random() * 2 - 1, a = Math.random() * 6.283, s = Math.sqrt(1 - u * u), w = .5 + Math.random() * .5, t = Math.random();
          p.set([r * s * Math.cos(a), r * u, r * s * Math.sin(a)], i * 3); c.set([w * (.8 + .2 * t), w * .9, w * (1 - .2 * t)], i * 3);
        }
        const g = new T.BufferGeometry(); g.setAttribute('position', new T.BufferAttribute(p, 3)); g.setAttribute('color', new T.BufferAttribute(c, 3));
        return new T.Points(g, new T.PointsMaterial({ size, vertexColors: true, sizeAttenuation: true, transparent: true, depthWrite: false }));
      }
      const far = stars(2200, 180, 300, .5), near = stars(450, 70, 140, .8); scene.add(far, near);

      /* --- Mars Planet Background Mesh --- */
      const marsMat = new T.MeshStandardMaterial({ map: marsTex(), roughness: .85, metalness: .05 });
      const marsMesh = new T.Mesh(new T.SphereGeometry(14, 64, 64), marsMat);
      marsMesh.position.set(0, -18, -42);
      scene.add(marsMesh);
      const atmMat = new T.MeshBasicMaterial({ color: 0xff7842, transparent: true, opacity: .18, blending: T.AdditiveBlending, side: T.BackSide });
      const atmMesh = new T.Mesh(new T.SphereGeometry(14.7, 32, 32), atmMat);
      marsMesh.add(atmMesh);

      /* --- Materials --- */
      const std = o => new T.MeshStandardMaterial(o);
      const M = {
        gold: std({ map: foilTex('#c9962f', '#ffe08a', '#6b4a10'), metalness: .8, roughness: .35 }),
        silver: std({ map: foilTex('#aeb4bd', '#ffffff', '#5d646e'), metalness: .9, roughness: .3 }),
        chrome: std({ color: 0xe4e8ef, metalness: 1, roughness: .12 }),
        cell: std({ map: cellTex(), metalness: .45, roughness: .25 }),
        frame: std({ color: 0x6f7882, metalness: .6, roughness: .5 }),
        back: std({ color: 0x9aa1ab, metalness: .5, roughness: .6 }),
        dish: std({ map: chkTex('#2d3037', '#25282e', 16), metalness: .35, roughness: .55, side: T.DoubleSide }),
        rad: std({ map: chkTex('#cfd3da', '#8f959e'), metalness: .6, roughness: .4 }),
        noz: std({ color: 0x7d838d, metalness: .9, roughness: .35, side: T.DoubleSide }),
        orange: std({ color: 0xe2701f, metalness: .4, roughness: .45, side: T.DoubleSide }),
        dark: std({ color: 0x15181d, metalness: .6, roughness: .4 }),
        copper: std({ color: 0xb8602a, metalness: .9, roughness: .3 }),
        lens: std({ color: 0x0a1230, metalness: .9, roughness: .08, emissive: 0x0a2a6a, emissiveIntensity: .7 })
      };

      /* --- Spacecraft anatomy. Each selectable subsystem is a Group tagged userData.part --- */
      const craft = new T.Group(); scene.add(craft); const parts = {};
      const part = id => (parts[id] = new T.Group(), parts[id].userData.part = id, craft.add(parts[id]), parts[id]);
      const mesh = (g, m, x, y, z, p) => { const o = new T.Mesh(g, m); o.position.set(x, y, z); o.castShadow = o.receiveShadow = true; p && p.add(o); return o };
      const box = (w, h, d) => new T.BoxGeometry(w, h, d), cyl = (a, b, h, s = 24, open) => new T.CylinderGeometry(a, b, h, s, 1, open);
      const dishGeo = (R, k) => { const q = []; for (let i = 0; i <= 20; i++) { const r = R * i / 20; q.push(new T.Vector2(r, k * r * r)) } return new T.LatheGeometry(q, 48) };
      const strut = (a, b, r, m, p) => { const v = b.clone().sub(a), o = new T.Mesh(cyl(r, r, v.length(), 6), m); o.position.copy(a).add(b).multiplyScalar(.5); o.quaternion.setFromUnitVectors(V(0, 1, 0), v.normalize()); o.castShadow = true; p.add(o) };

      {/* Bus: silver MLI sides, gold MLI decks, corner posts */
        const g = part('bus'); mesh(box(2, 2, 2), [M.silver, M.silver, M.gold, M.gold, M.silver, M.silver], 0, 0, 0, g);
        [1.01, -1.01].forEach(y => mesh(box(2.06, .05, 2.06), M.frame, 0, y, 0, g));
        [[1, 1], [1, -1], [-1, 1], [-1, -1]].forEach(a => mesh(box(.06, 2.06, .06), M.frame, a[0], 0, a[1], g));
      }
      {/* Propellant tank dome with copper heater rings */
        const g = part('tank'); mesh(new T.SphereGeometry(.72, 48, 24, 0, PI * 2, 0, PI / 2), M.chrome, 0, 1.2, 0, g); mesh(cyl(.74, .74, .2, 48), M.silver, 0, 1.1, 0, g);
        [1.06, 1.14].forEach(y => mesh(new T.TorusGeometry(.745, .014, 8, 64), M.copper, 0, y, 0, g).rotation.x = PI / 2);
      }
      {/* Tri-panel solar array on a yoke, with hinges */
        const g = part('array'); mesh(cyl(.07, .07, .5, 12), M.frame, -1.25, 0, 0, g).rotation.z = PI / 2; mesh(box(.12, .09, .5), M.frame, -1.4, 0, 0, g);
        for (let i = 0; i < 3; i++) { const x = -2.55 - i * 2.4; mesh(box(2.3, .07, 2.2), [M.frame, M.frame, M.cell, M.back, M.frame, M.frame], x, 0, 0, g); if (i) mesh(box(.12, .09, .5), M.frame, x + 1.2, 0, 0, g) }
      }
      {/* 440 N Liquid Apogee Motor */
        const g = part('lam'); mesh(cyl(.38, .38, .2, 32), M.dark, 0, -1.1, 0, g); mesh(cyl(.13, .44, .7, 40, true), M.noz, 0, -1.55, 0, g);
        mesh(new T.TorusGeometry(.44, .02, 8, 40), M.gold, 0, -1.9, 0, g).rotation.x = PI / 2;
      }
      {/* Four 2×22 N thruster pods */
        const g = part('thr');[[1, 1], [-1, 1], [1, -1], [-1, -1]].forEach(a => {
          const p = new T.Group(); p.position.set(a[0] * .92, -1.12, a[1] * .92); g.add(p);
          mesh(box(.3, .14, .3), M.gold, 0, 0, 0, p);[-.07, .07].forEach(o => mesh(new T.ConeGeometry(.075, .22, 14, 1, true), M.noz, o, -.17, 0, p))
        })
      }
      {/* High-gain dish, boom, feed horn and tripod struts */
        const g = part('hga'); g.position.set(2.85, .35, 0); g.rotation.z = -PI / 2 + .2;
        mesh(dishGeo(1.35, .32), M.dish, 0, 0, 0, g); mesh(cyl(.07, .07, 1.9, 10), M.frame, 0, -.95, 0, g); mesh(cyl(.28, .4, .16, 24), M.frame, 0, -.04, 0, g);
        mesh(new T.ConeGeometry(.12, .28, 16), M.gold, 0, .8, 0, g).rotation.x = PI;
        [0, 2.1, 4.2].forEach(a => strut(V(Math.cos(a) * 1.3, .541, Math.sin(a) * 1.3), V(0, .74, 0), .018, M.frame, g));
      }
      {/* Low/medium-gain antennas: boom-mounted orange dish + deck dish + LGA stub */
        const g = part('ant'); strut(V(-.9, 1.05, .9), V(-1.6, 1.75, 1.25), .03, M.frame, g);
        const d1 = mesh(dishGeo(.3, 1.1), M.orange, -1.6, 1.75, 1.25, g); d1.quaternion.setFromUnitVectors(V(0, 1, 0), V(-.5, .6, .6).normalize());
        const lg = mesh(new T.ConeGeometry(.05, .34, 10), M.gold, -1.6, 1.75, 1.25, g); lg.quaternion.copy(d1.quaternion); lg.translateY(.17);
        mesh(dishGeo(.26, 1.1), M.orange, .05, 1.1, .98, g).quaternion.setFromUnitVectors(V(0, 1, 0), V(.2, .8, .6).normalize());
      }
      {/* Mars Color Camera: gold housing + barrel + lens on the front face */
        const g = part('mcc'); mesh(box(.46, .42, .3), M.gold, .45, .55, 1.15, g); mesh(cyl(.14, .14, .3, 24), M.dark, .45, .55, 1.4, g).rotation.x = PI / 2;
        mesh(new T.CircleGeometry(.1, 24), M.lens, .45, .55, 1.556, g);
      }
      {/* Thermal IR Imaging Spectrometer: radiator patch + aperture */
        const g = part('tis'); mesh(box(.6, .3, .45), M.gold, -.85, 1.18, .62, g); mesh(box(.5, .02, .35), M.rad, -.85, 1.34, .62, g);
        mesh(cyl(.08, .08, .3, 16), M.dark, -.85, 1.2, .92, g).rotation.x = PI / 2;
      }
      {/* Methane Sensor for Mars */
        const g = part('msm'); mesh(box(.5, .28, .38), M.gold, .85, 1.17, .62, g); mesh(cyl(.07, .07, .34, 16), M.chrome, .85, 1.2, .92, g).rotation.x = PI / 2;
        mesh(box(.16, .08, .16), M.rad, .85, 1.35, .62, g);
      }
      {/* Exospheric neutral mass spectrometer (MENCA) */
        const g = part('menca'); mesh(box(.5, .24, .4), M.gold, .85, 1.15, -.7, g); mesh(cyl(.12, .12, .5, 20), M.chrome, .85, 1.52, -.7, g);
      }
      {/* Lyman Alpha Photometer: gold box + long baffle tube */
        const g = part('lap'); mesh(box(.5, .26, .36), M.gold, -.85, 1.16, -.7, g); mesh(cyl(.09, .09, .6, 18), M.dark, -.85, 1.3, -1, g).rotation.x = PI / 2;
      }

      /* --- Additive glow highlight (overlay clones of the selected part's meshes) --- */
      const glowMat = new T.MeshBasicMaterial({ color: 0x35d8ff, transparent: true, opacity: .45, blending: T.AdditiveBlending, depthWrite: false, side: T.DoubleSide, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 });
      const glows = {};
      function setGlow(id) {
        Object.values(glows).flat().forEach(g => g.visible = false); if (!id) return;
        if (!glows[id]) {
          const ms = []; parts[id].traverse(o => { if (o.isMesh && !o.userData.glow) ms.push(o) });
          glows[id] = ms.map(m => { const g = new T.Mesh(m.geometry, glowMat); g.userData.glow = 1; g.scale.setScalar(1.04); m.add(g); return g })
        }
        glows[id].forEach(g => g.visible = true);
      }

      /* --- Camera rig: smoothed orbit (current → goal) with inertia, zoom, focus tweening --- */
      const home = { t: V(-2.05, .1, 0), th: .9, ph: 1.15, d: 15 };
      const goal = { t: home.t.clone(), th: home.th, ph: home.ph, d: home.d }, cur = { t: home.t.clone(), th: home.th - 1, ph: 1.3, d: 26 }, vel = { x: 0, y: 0 };
      let sel = null, drag = false, raf = 0, tw = 0, last = performance.now();

      /* --- UI: chips, info card with typewriter --- */
      [...new Set(MOM_PARTS.map(p => p[1]))].forEach(gn => {
        const d = document.createElement('div'); d.className = 'mom-g';
        d.innerHTML = '<small>' + gn + '</small><div>' + MOM_PARTS.filter(p => p[1] === gn).map(p => '<button class="mom-chip" data-id="' + p[0] + '">' + p[2] + '</button>').join('') + '</div>'; bar.appendChild(d)
      });
      bar.addEventListener('click', e => { const b = e.target.closest('.mom-chip'); if (b) select(b.dataset.id) });
      $('.mom-x').addEventListener('click', () => reset());
      root.addEventListener('keydown', e => { if (e.key === 'Escape') reset() });
      function typeText(s, done) {
        clearInterval(tw); let n = 0; txt.classList.add('ty');
        tw = setInterval(() => { txt.textContent = s.slice(0, n += 2); if (n >= s.length) { clearInterval(tw); txt.classList.remove('ty'); done && done() } }, 16)
      }
      function select(id) {
        const p = MOM_PARTS.find(q => q[0] === id); if (!p) return reset();
        sel = p; setGlow(id); goal.t.set(p[4][0], p[4][1], p[4][2]); goal.d = p[5]; goal.th = cur.th + wrap(p[6] - cur.th); goal.ph = p[7]; vel.x = vel.y = 0;
        bar.querySelectorAll('.mom-chip').forEach(b => { const on = b.dataset.id === id; b.classList.toggle('on', on); on && b.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' }) });
        card.querySelector('i').textContent = p[1]; card.querySelector('h3').textContent = p[3];
        sp.classList.remove('on'); sp.innerHTML = p[9].map(s => '<dt>' + s[0] + '</dt><dd>' + s[1] + '</dd>').join(''); card.classList.add('on');
        typeText(p[8], () => sp.classList.add('on'));
      }
      function reset() {
        sel = null; setGlow(null); clearInterval(tw); goal.t.copy(home.t); goal.d = home.d; goal.th = cur.th + wrap(home.th - cur.th); goal.ph = home.ph;
        card.classList.remove('on'); bar.querySelectorAll('.mom-chip.on').forEach(b => b.classList.remove('on'));
      }

      /* --- Pointer input: orbit, pinch-zoom, wheel, click-to-pick --- */
      const ptrs = new Map(), ray = new T.Raycaster(), m2 = new T.Vector2(); let moved = 0, pd = 0;
      const pinch = () => { const a = [...ptrs.values()]; return a.length > 1 ? Math.hypot(a[0][0] - a[1][0], a[0][1] - a[1][1]) : 0 };
      canvas.addEventListener('pointerdown', e => { canvas.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); drag = true; moved = 0; vel.x = vel.y = 0; pd = pinch() });
      canvas.addEventListener('pointermove', e => {
        const o = ptrs.get(e.pointerId); if (!o) return; const dx = e.clientX - o[0], dy = e.clientY - o[1]; ptrs.set(e.pointerId, [e.clientX, e.clientY]); moved += Math.abs(dx) + Math.abs(dy);
        if (ptrs.size === 1) { vel.x = -dx * .0055; vel.y = -dy * .0055; goal.th += vel.x; goal.ph += vel.y }
        else { const d = pinch(); if (d && pd) goal.d *= pd / d; pd = d }
      });
      const up = e => { if (!ptrs.delete(e.pointerId)) return; if (!ptrs.size) { drag = false; if (e.type === 'pointerup' && moved < 6) pick(e) } else pd = pinch() };
      canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
      canvas.addEventListener('wheel', e => { e.preventDefault(); goal.d *= Math.exp(e.deltaY * .001) }, { passive: false });
      function pick(e) {
        const r = canvas.getBoundingClientRect(); m2.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1); ray.setFromCamera(m2, camera);
        const h = ray.intersectObjects(craft.children, true).find(x => !x.object.userData.glow); if (!h) return;
        let o = h.object; while (o && !o.userData.part) o = o.parent; if (o) select(o.userData.part);
      }

      /* --- Resize (portrait screens pull the camera back) --- */
      function resize() {
        const w = root.clientWidth || 600, h = root.clientHeight || 480; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
        home.d = 15 * Math.max(1, 1.35 / camera.aspect); if (!sel) goal.d = home.d;
      }
      const ro = new ResizeObserver(resize); ro.observe(root); resize();

      /* --- Render loop --- */
      function frame(now) {
        raf = requestAnimationFrame(frame); const dt = Math.min(.05, (now - last) / 1000); last = now;
        if (!drag) { goal.th += vel.x; goal.ph += vel.y; vel.x *= .93; vel.y *= .93; if (!sel && opts.autoRotate && Math.abs(vel.x) < 1e-4) goal.th += .1 * dt }
        goal.ph = clamp(goal.ph, .15, PI - .15); goal.d = clamp(goal.d, 2, 32);
        const k = 1 - Math.exp(-dt * 5); cur.th += (goal.th - cur.th) * k; cur.ph += (goal.ph - cur.ph) * k; cur.d += (goal.d - cur.d) * k; cur.t.lerp(goal.t, k);
        camera.position.set(cur.t.x + cur.d * Math.sin(cur.ph) * Math.sin(cur.th), cur.t.y + cur.d * Math.cos(cur.ph), cur.t.z + cur.d * Math.sin(cur.ph) * Math.cos(cur.th));
        camera.lookAt(cur.t);
        glowMat.opacity = .38 + .2 * Math.sin(now * .005);
        craft.position.y = Math.sin(now * .0007) * .05; far.rotation.y += dt * .004; near.rotation.y -= dt * .007;
        marsMesh.rotation.y += dt * .015; /* Rotate Mars slowly */
        renderer.render(scene, camera);
      }
      raf = requestAnimationFrame(frame);

      function destroy() { cancelAnimationFrame(raf); clearInterval(tw); ro.disconnect(); renderer.dispose(); root.innerHTML = ''; root.classList.remove('mom') }
      return { select, reset, destroy, renderer, scene, camera };
    }

    /* ===== Demo mount ===== */
    window.mom = MarsOrbiterMission(document.getElementById('mom'));
  </script>
</body>
