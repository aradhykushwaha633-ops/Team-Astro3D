<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chandrayaan-3 Vikram Lander</title>
  <style>
    html,
    body {
      margin: 0;
      background: #05060a
    }

    body {
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    /* Demo only: give the widget a size. On your site, set any width/height on the .vk element's parent. */
    .demo {
      height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
      height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px))
    }

    /* ===== VIKRAM WIDGET CSS (copy) ===== */
    .vk {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 320px;
      background: #000;
      overflow: hidden;
      color: #f2efe6;
      font-family: Georgia, "Times New Roman", serif;
      touch-action: pan-y
    }

    .vk canvas {
      display: block;
      width: 100%;
      height: 100%
    }

    .vk .vk-t {
      position: absolute;
      top: 16px;
      left: 18px;
      right: 18px;
      pointer-events: none;
      text-shadow: 0 1px 6px #000
    }

    .vk .vk-t b {
      display: block;
      font-weight: 400;
      font-size: clamp(20px, 4.5vw, 30px)
    }

    .vk .vk-t span {
      font-size: 14px;
      color: #a9a69c
    }

    .vk .vk-ui {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      pointer-events: none
    }

    .vk .vk-s {
      font-size: 15px;
      color: #e3b84a;
      text-shadow: 0 1px 6px #000;
      max-width: 62%
    }

    .vk button {
      pointer-events: auto;
      font: inherit;
      font-size: 15px;
      color: #f2efe6;
      background: rgba(5, 6, 10, .6);
      border: 1px solid rgba(242, 239, 230, .25);
      border-radius: 999px;
      padding: 9px 18px;
      cursor: pointer
    }

    .vk button:hover {
      border-color: #e3b84a
    }

    .vk button:focus-visible {
      outline: 2px solid #e3b84a;
      outline-offset: 2px
    }

    .vk [hidden] {
      display: none !important
    }

    .vk .vk-chips {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 68px;
      display: flex;
      gap: 14px;
      overflow-x: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(223, 190, 58, 0.5) rgba(255, 255, 255, 0.05);
      padding: 6px 0 12px 0;
      align-items: flex-start;
      pointer-events: auto;
      z-index: 15;
    }

    .vk .vk-chips::-webkit-scrollbar {
      height: 6px;
    }

    .vk .vk-chips::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 999px;
    }

    .vk .vk-chips::-webkit-scrollbar-thumb {
      background: rgba(227, 184, 74, 0.5);
      border-radius: 999px;
    }

    .vk .vk-chips::-webkit-scrollbar-thumb:hover {
      background: rgba(227, 184, 74, 0.8);
    }

    .vk .vk-part-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
      flex: 0 0 auto
    }

    .vk .vk-group-title {
      font: 11px Arial, sans-serif;
      letter-spacing: .13em;
      text-transform: uppercase;
      color: #b8b7bd;
      padding-left: 5px
    }

    .vk .vk-chip-row {
      display: flex;
      gap: 8px;
      align-items: center
    }

    .vk .vk-chips.in {
      animation: vkUp .6s both
    }

    .vk .vk-chips button {
      position: relative;
      z-index: 5;
      touch-action: manipulation
    }

    .vk .vk-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      padding: 7px 14px;
      font-size: 14px;
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px)
    }

    .vk .vk-chip i {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      box-shadow: 0 0 8px currentColor
    }

    .vk .vk-chip.on {
      background: rgba(255, 255, 255, .14);
      border-color: var(--c)
    }

    .vk .vk-card {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 112px;
      padding: 20px 20px 16px;
      border-radius: 18px;
      overflow: hidden;
      pointer-events: auto;
      z-index: 20;
      background: linear-gradient(160deg, rgba(18, 22, 36, .84), rgba(8, 10, 18, .8));
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, .14);
      box-shadow: 0 12px 40px rgba(0, 0, 0, .5), 0 0 34px -8px var(--c)
    }

    .vk .vk-card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      height: 3px;
      width: 100%;
      background: linear-gradient(90deg, var(--c), transparent);
      transform-origin: left
    }

    .vk .vk-card.on {
      animation: vkIn .55s cubic-bezier(.2, .9, .2, 1) both
    }

    .vk .vk-card.on::before {
      animation: vkLine .9s .1s cubic-bezier(.2, .9, .2, 1) both
    }

    .vk .vk-x {
      position: absolute;
      top: 10px;
      right: 12px;
      width: 30px;
      height: 30px;
      padding: 0;
      border-radius: 50%;
      font-size: 18px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      cursor: pointer;
      z-index: 25;
    }

    .vk .vk-k {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--c)
    }

    .vk .vk-k i {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--c);
      box-shadow: 0 0 10px var(--c)
    }

    .vk .vk-card.on .vk-k {
      animation: vkUp .5s .08s both
    }

    .vk .vk-n {
      margin: 6px 0 8px;
      font-weight: 400;
      font-size: 25px;
      letter-spacing: .01em
    }

    .vk .vk-n span {
      display: inline-block;
      animation: vkLetter .5s calc(.12s + var(--i)*.03s) both
    }

    .vk .vk-d {
      margin: 0;
      font-size: 15px;
      line-height: 1.55;
      color: #d9d6cc;
      min-height: 4.6em
    }

    .vk .vk-d.typing::after {
      content: "";
      display: inline-block;
      width: 2px;
      height: 1em;
      margin-left: 2px;
      vertical-align: -2px;
      background: var(--c);
      animation: vkBlink .7s steps(2) infinite
    }

    .vk .vk-st {
      display: flex;
      gap: 10px;
      margin-top: 14px
    }

    .vk .vk-st div {
      flex: 1;
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(255, 255, 255, .06);
      border: 1px solid rgba(255, 255, 255, .09);
      animation: vkUp .5s calc(.45s + var(--i)*.1s) both
    }

    .vk .vk-st small {
      display: block;
      font-size: 11px;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: #a9a69c
    }

    .vk .vk-st b {
      font-weight: 400;
      font-size: 15px;
      color: var(--c)
    }

    @media(min-width:760px) {
      .vk .vk-card {
        left: auto;
        right: 24px;
        top: 96px;
        bottom: auto;
        width: 340px
      }
    }

    @keyframes vkIn {
      from {
        opacity: 0;
        transform: translateY(18px) scale(.96);
        filter: blur(6px)
      }

      to {
        opacity: 1;
        transform: none;
        filter: none
      }
    }

    @keyframes vkUp {
      from {
        opacity: 0;
        transform: translateY(10px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    @keyframes vkLine {
      from {
        transform: scaleX(0)
      }

      to {
        transform: scaleX(1)
      }
    }

    @keyframes vkLetter {
      from {
        opacity: 0;
        transform: translateY(.5em);
        filter: blur(4px)
      }

      to {
        opacity: 1;
        transform: none;
        filter: none
      }
    }

    @keyframes vkBlink {
      50% {
        opacity: 0
      }
    }

    @media(prefers-reduced-motion:reduce) {
      .vk * {
        animation: none !important
      }
    }
  </style>
  <style id="fx-css">
    /* ===== FX layer v2: replayable scroll reveal, 3D tab transition, 3D viewer, responsive polish ===== */
    :root {
      --fx-e: cubic-bezier(.16, 1, .3, 1)
    }

    html {
      overflow-x: clip;
      scroll-padding-top: 5rem;
      -webkit-text-size-adjust: 100%
    }

    body {
      min-height: 100vh !important
    }

    .fx-wait body {
      opacity: 0
    }

    html:not(.fx-wait) body {
      animation: fxFade .6s ease backwards
    }

    @keyframes fxFade {
      from {
        opacity: 0
      }
    }

    body [data-fx]:not(.fx-in) {
      opacity: 0;
      translate: var(--fx-x, 0) var(--fx-y, 0);
      scale: var(--fx-s, 1);
rotate: var(--fx-r, 0deg)
    }

    body [data-fx].fx-fade:not(.fx-in) {
      translate: 0 0;
      scale: 1;
rotate: 0deg
    }

    body [data-fx].fx-run {
      transition: opacity var(--fx-t, .8s) var(--fx-e), translate var(--fx-t, .8s) var(--fx-e), scale var(--fx-t, .8s) var(--fx-e), rotate var(--fx-t, .8s) var(--fx-e);
      transition-delay: var(--fx-d, 0s);
      will-change: opacity, translate, scale, rotate
    }

    button:active {
      scale: .97
    }

    .fx-bar {
      position: fixed;
      inset: 0 0 auto 0;
      height: 3px;
      z-index: 60;
      transform-origin: 0 50%;
      transform: scaleX(0);
      background: linear-gradient(90deg, #8b5cf6, #38bdf8, #f472b6);
      pointer-events: none
    }

    .fx-top {
      position: fixed;
      right: max(1rem, env(safe-area-inset-right));
      bottom: max(1rem, env(safe-area-inset-bottom));
      z-index: 60;
      width: 2.75rem;
      height: 2.75rem;
      border-radius: 50%;
      display: grid;
      place-items: center;
      cursor: pointer;
      border: 1px solid rgba(167, 139, 250, .5);
      background: rgba(15, 23, 42, .82);
      color: #ddd6fe;
      backdrop-filter: blur(8px);
      opacity: 0;
      translate: 0 16px;
      scale: .8;
      pointer-events: none;
      transition: opacity .4s, translate .5s var(--fx-e), scale .5s var(--fx-e), background-color .3s
    }

    .fx-top.on {
      opacity: 1;
      translate: 0 0;
      scale: 1;
      pointer-events: auto
    }

    .fx-top:hover {
      background: rgba(124, 58, 237, .92)
    }

    .fx-tab-out {
      animation: fxTabOut .26s ease-in both
    }

    .fx-tab-in {
      animation: fxTabIn .8s var(--fx-e) both
    }

    @keyframes fxTabOut {
      to {
        opacity: 0;
        transform: perspective(1200px) rotateX(9deg) translateY(-24px) scale(.97)
      }
    }

    @keyframes fxTabIn {
      from {
        opacity: 0;
        transform: perspective(1200px) rotateX(-14deg) translateY(36px) scale(.96)
      }
    }

    .fx-3d {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: grid;
      place-items: center;
      padding: max(.75rem, env(safe-area-inset-top)) max(.75rem, env(safe-area-inset-right)) max(.75rem, env(safe-area-inset-bottom)) max(.75rem, env(safe-area-inset-left));
      background: rgba(2, 3, 8, .82);
      backdrop-filter: blur(6px);
      opacity: 0;
      visibility: hidden;
      transition: opacity .35s, visibility 0s .35s;
      perspective: 1400px
    }

    .fx-3d.on {
      opacity: 1;
      visibility: visible;
      transition: opacity .35s
    }

    .fx-3d>div {
      position: relative;
      width: min(1100px, 100%);
      height: min(760px, 100%);
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(167, 139, 250, .35);
      box-shadow: 0 30px 80px rgba(0, 0, 0, .6);
      transform: rotateX(14deg) translateY(40px) scale(.92);
      opacity: 0;
      transition: transform .7s var(--fx-e), opacity .5s
    }

    .fx-3d.on>div {
      transform: none;
      opacity: 1
    }

    .fx-3d iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000
    }

    .fx-3d .fx-x {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 2;
      width: 2.5rem;
      height: 2.5rem;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, .3);
      background: rgba(5, 6, 10, .7);
      color: #fff;
      font-size: 1.3rem;
      line-height: 1;
      cursor: pointer
    }

    @media(max-width:640px) {

      input,
      select,
      textarea {
        font-size: 16px !important
      }

      [class*="h-[260px]"] {
        height: auto !important;
        min-height: 260px
      }

      h1,
      h2 {
        overflow-wrap: anywhere
      }
    }

    @media(prefers-reduced-motion:reduce) {
      body [data-fx] {
        opacity: 1 !important;
        translate: none !important;
        scale: none !important;
        transition: none !important
      }

      html:not(.fx-wait) body {
        animation: none
      }

      .fx-tab-in,
      .fx-tab-out {
        animation: none
      }

      .fx-3d>div {
        transform: none
      }

      .fx-top,
      .fx-bar {
        transition: none
      }
    }
  </style>
  <script>if (!matchMedia("(prefers-reduced-motion:reduce)").matches) { document.documentElement.classList.add("fx-wait"); setTimeout(function () { document.documentElement.classList.remove("fx-wait") }, 2500) }</script>
  <style id="vk-css">
    /* ===== Lander viewer: view bar + responsive ===== */
    .vk canvas {
      touch-action: none
    }

    .vk .vk-views {
      position: absolute;
      left: 18px;
      right: 18px;
      top: 80px;
      display: flex;
      gap: 8px;
      align-items: center;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 4px 0;
      pointer-events: auto;
      z-index: 5
    }

    .vk .vk-views::-webkit-scrollbar {
      display: none
    }

    .vk .vk-views:not([hidden]) {
      animation: vkUp .6s both
    }

    .vk .vk-views button {
      flex: 0 0 auto;
      padding: 6px 13px;
      font-size: 13px;
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      transition: border-color .25s, background-color .25s, transform .25s
    }

    .vk .vk-views button.on {
      border-color: #e3b84a;
      background: rgba(227, 184, 74, .16)
    }

    .vk .vk-views button:active {
      transform: scale(.94)
    }

    .vk .vk-views i {
      flex: 0 0 1px;
      align-self: stretch;
      background: rgba(242, 239, 230, .2)
    }

    @media(min-width:760px) {
      .vk .vk-views {
        left: 18px;
        right: auto;
        top: 50%;
        translate: 0 -50%;
        flex-direction: column;
        align-items: stretch;
        overflow: visible;
        width: max-content
      }

      .vk .vk-views i {
        flex: 0 0 1px;
        height: 1px;
        width: auto;
        align-self: auto
      }
    }

    @media(max-width:759px) {
      .vk .vk-card {
        max-height: 44%;
        overflow-y: auto
      }
    }

    @media(max-width:480px) {
      .vk .vk-card {
        padding: 14px
      }

      .vk .vk-n {
        font-size: 21px
      }

      .vk .vk-d {
        font-size: 14px;
        min-height: 0
      }

      .vk .vk-st {
        flex-wrap: wrap
      }

      .vk .vk-st div {
        flex: 1 1 40%
      }
    }

    @media(max-height:520px) and (orientation:landscape) {
      .vk .vk-t span {
        display: none
      }

      .vk .vk-views button {
        padding: 4px 10px;
        font-size: 12px
      }

      .vk .vk-card {
        left: auto;
        right: 14px;
        top: 56px;
        bottom: auto;
        width: min(320px, 46vw);
        max-height: calc(100% - 140px);
        overflow-y: auto
      }
    }
  </style>
<script src="script2.js"></script>
</head>

<body>

  <div class="demo">
    <!-- ===== VIKRAM WIDGET HTML (copy) ===== -->
    <div class="vk" id="vikram">
      <div class="vk-t"><b>Chandrayaan-3: Vikram lander</b><span>Interactive lunar surface • Vikram + Pragyan</span>
      </div>
      <div class="vk-ui"><span class="vk-s">Descending…</span><button type="button" class="vk-r">Replay landing</button>
      </div>
    </div>
  </div>

  <!-- ===== VIKRAM WIDGET JS (copy) ===== -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    function VikramLander(root, opt) {
      opt = Object.assign({ rover: true }, opt || {});
      const sEl = root.querySelector('.vk-s'), setS = t => { if (sEl) sEl.textContent = t };
      const canvas = document.createElement('canvas'); root.insertBefore(canvas, root.firstChild);
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.shadowMap.enabled = true;
      const scene = new THREE.Scene(); scene.background = new THREE.Color(0); scene.fog = new THREE.Fog(0, 45, 115);
      const camera = new THREE.PerspectiveCamera(45, 1, .1, 400);
      const V3 = (a) => new THREE.Vector3(a[0], a[1], a[2]);

      // ---- Sky, light
      {
        const n = 1500, p = new Float32Array(n * 3);
        for (let i = 0; i < n; i++) { const u = Math.random() * 2 - 1, t = Math.random() * 6.283, r = Math.sqrt(1 - u * u); p[i * 3] = 180 * r * Math.cos(t); p[i * 3 + 1] = Math.abs(180 * u) * .8 + 8; p[i * 3 + 2] = 180 * r * Math.sin(t); }
        const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(p, 3));
        scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: .9, sizeAttenuation: false, fog: false })));
      }
      scene.add(new THREE.HemisphereLight(0x8a93b8, 0x2a2622, .5));
      const sun = new THREE.DirectionalLight(0xfff2dc, 1.7); sun.position.set(-14, 10, 11); sun.castShadow = true;
      sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16, near: 1, far: 60 }); scene.add(sun);

      // ---- Terrain: procedural lunar regolith texture
      function lunarTexture() {
        const c = document.createElement('canvas'); c.width = 1024; c.height = 1024; const x = c.getContext('2d'), im = x.createImageData(1024, 1024);
        for (let i = 0; i < im.data.length; i += 4) { const n = (Math.random() - .5) * 30, v = 137 + n; im.data[i] = v + 2; im.data[i + 1] = v + 1; im.data[i + 2] = v - 2; im.data[i + 3] = 255; }
        x.putImageData(im, 0, 0);
        for (let i = 0; i < 4200; i++) { const r = .3 + Math.random() * 4; x.fillStyle = `rgba(${Math.random() > .5 ? '55,53,50' : '225,222,211'},${Math.random() * .22})`; x.beginPath(); x.arc(Math.random() * 1024, Math.random() * 1024, r, 0, Math.PI * 2); x.fill(); }
        const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(5, 5); t.anisotropy = 4; return t;
      }
      const lunarAlbedo = lunarTexture();
      // ---- Terrain
      const craters = [[12, -8, 5], [-14, 6, 6], [8, 14, 4], [-9, -13, 4.5], [22, 5, 3.2], [-24, -8, 4.2], [18, -22, 2.8], [-4, 26, 3.6], [29, 20, 5.5], [-30, 18, 3.8], [3, -29, 4.5]];
      function hgt(x, z) {
        const r = Math.hypot(x, z);
        let y = Math.sin(x * .35) * Math.cos(z * .3) * .5 + Math.sin(x * .9 + z * .7) * .15 + Math.sin(z * 1.7 - x * .4) * .07;
        let k = Math.min(1, Math.max(0, (r - 5) / 8)); k = k * k * (3 - 2 * k); y *= k;
        for (const c of craters) { const d = Math.hypot(x - c[0], z - c[1]) / c[2]; if (d < 1) y -= (1 - d * d) * .9; else if (d < 1.3) y += Math.exp(-Math.pow((d - 1) * 6, 2)) * .25; }
        return y;
      }
      {
        const g = new THREE.PlaneGeometry(140, 140, 170, 170); g.rotateX(-Math.PI / 2); const p = g.attributes.position;
        for (let i = 0; i < p.count; i++)p.setY(i, hgt(p.getX(i), p.getZ(i))); g.computeVertexNormals();
        const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ map: lunarAlbedo, bumpMap: lunarAlbedo, bumpScale: .12, color: 0xb1aea6, roughness: 1 })); m.receiveShadow = true; scene.add(m);
        const rg = new THREE.DodecahedronGeometry(1, 0), rm = new THREE.MeshStandardMaterial({ color: 0x6f6d69, roughness: 1 });
